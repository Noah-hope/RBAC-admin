server:
  port: ${RBAC1_PORT:8081}

spring:
  datasource:
    url: ${RBAC1_DB_URL}
    username: ${RBAC1_DB_USERNAME}
    password: ${RBAC1_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true

rbac:
  jwt:
    issuer: ${RBAC1_JWT_ISSUER:http://localhost:8081}
    private-key: ${RBAC1_JWT_PRIVATE_KEY:file:./jwt-private.pem}
    public-key: ${RBAC1_JWT_PUBLIC_KEY:file:./jwt-public.pem}
  bootstrap:
    username: ${RBAC1_ADMIN_USERNAME:admin}
    password: ${RBAC1_ADMIN_PASSWORD:}

# 分层日志级别。三个业务包为 DEBUG，由 config/LayerLoggingAspect 输出；
# Docker Swarm 部署时用 LOGGING_LEVEL_COM_RBAC_RBAC1_CONTROLLER 等环境变量覆盖。
logging:
  level:
    root: INFO
    com.rbac.rbac1.controller: DEBUG
    com.rbac.rbac1.service: DEBUG
    com.rbac.rbac1.mapper: DEBUG
