    put:
      operationId: updateRole
      tags:
        - 角色管理
      summary: 保存角色直接权限与继承关系
      description: 仅总管理员。提交名称、说明、最终直接权限 permissionIds 和最终直接父角色
        inheritedRoleIds，一次替换该角色在所有应用中的配置；[] 清空相应关联，省略必需列表返回
        400。新增直接权限按本次最终继承关系判断，不允许重复配置已继承权限。保存前已经存在的直接权限，即使本次与继承重叠，也允许保留；取消直接勾选只移除直接关联，其他来源仍在则权限继续有效。按钮所属菜单按本次最终有效权限判断，菜单已继承时不要求加入直接权限。校验全部业务父角色及自继承、循环继承，失败整次回滚。成功时同步保存直接授权、继承关系和日志；所有受影响角色、用户下次查询或检查反映结果，不保存继承权限副本。
        返回的 roleType、父子关系、权限数量和 assignedUserCount 均为服务端计算字段，不接受客户端提交。
        预置管理角色仅可查看，对其提交修改返回 403。
        修改权限或继承关系时，按拟保存的配置检查当前角色及全部直接、间接子角色。若修改后某个角色仍拥有按钮，却不再拥有其所属菜单，返回
        400，提示受影响角色、按钮和菜单，整次修改不保存。其他直接或继承来源仍提供菜单时，不因该菜单依赖拒绝修改。前端预览用于提示，后端保存时执行同一校验。
        同一授权变更流程按受影响角色及其后代所关联用户的当前有效权限检查待审核申请，权限已满足则转 SATISFIED，已结束申请状态不变。
      x-ui-operations:
        - R04
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleConfigurationInput"
            examples:
              save:
                summary: 继承菜单并保存直接按钮
                value:
                  name: 课程审核员
                  description: 继承课程菜单，直接配置审核按钮
                  permissionIds:
                    - 102
                  inheritedRoleIds:
                    - 7
              keepExistingOverlap:
                summary: 101 在保存前已是直接权限，允许保留已有重叠
                value:
                  name: 课程审核员
                  permissionIds:
                    - 101
                    - 102
                  inheritedRoleIds:
                    - 7
              removeDirectKeepInherited:
                summary: 取消对101的直接配置，仍从角色7继承
                value:
                  name: 课程审核员
                  permissionIds:
                    - 102
                  inheritedRoleIds:
                    - 7
              removeInheritance:
                summary: 解除全部继承，同时将菜单和按钮保留为直接权限
                value:
                  name: 课程审核员
                  permissionIds:
                    - 101
                    - 102
                  inheritedRoleIds: []
              clearAll:
