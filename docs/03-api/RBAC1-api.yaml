  /api/v1/operation-logs:
    get:
      operationId: listOperationLogs
      tags: [ 操作记录 ]
      summary: 查看或搜索操作记录
      description: >-
        总管理员查看全部记录。部门管理员查看本部门及下级部门用户的管理记录，

        以操作发生时用户所属的部门判断。同一批次涉及多部门时，只返回管理范围内的对象，

        搜索和分页同样基于筛选后的记录和对象。

        应用登记、角色权限配置、部门结构维护、跨部门调动等全局记录仅总管理员可见。
         包含 API 登记/编辑/移除、权限 API 关联变更、权限申请提交/撤回/审核，以及角色创建申请提交/通过/拒绝。申请和角色创建处理为 GLOBAL，只有总管理员查询；不记录读取、打开编辑或取消行为。密码与完整登录令牌不得写入 detail。 RBAC1 增加角色继承关系新增、解除和变更记录，属于 GLOBAL，仅总管理员查看。
      x-ui-operations: [ O01 ]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          description: 搜索操作人、可见对象或操作内容
          schema: { $ref: '#/components/schemas/Keyword' }
      responses:
        '200':
          description: 可查看的操作记录分页结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationLogPage' }
              example:
                items:
                  - id: 130
                    occurredAt: 2026-11-10T09:15:00+08:00
                    actorName: 顾晨
                    action: 批量分配角色
                    targetNames:
                      - 林晓
                      - 何雨桐
                    detail: 课程管理员
                    result: SUCCESS
                page: 1
                pageSize: 20
                total: 1
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
      x-implementation-status: RBAC1 结构化后端已实现
