openapi: 3.1.0
info:
  title: RBAC1 权限中心 API
  version: 1.3.0
  description: >-
    RBAC1 独立设计契约，基于 RBAC0 的 openapi.yaml。RBAC1
    结构化后端已实现；面向对象实现遵循同一契约。除本文的继承扩展外，沿用 RBAC0 的统一身份、用户部门、应用、权限与 API
    管理、授权和操作记录规则。本文件用于独立 RBAC1 服务，在 Apifox 中导入 RBAC1 项目或模块，保留 RBAC0 原契约。


    仅业务角色参与多重、多层继承，禁止自继承和循环继承。TOTAL_ADMIN、DEPARTMENT_ADMIN 既不继承业务角色，也不被业务角色继承。继承不受应用边界限制，查询与检查权限时仍按目标应用筛选。用户仍只显式分配业务角色，不为其额外保存用户与祖先角色的关联。


    RoleConfigurationInput.permissionIds 只提交直接配置权限；inheritedRoleIds 只提交直接继承的角色。POST 和 PUT 均提交两个完整列表，[] 表示无直接权限或无继承角色，不能把完整有效权限列表当成直接权限保存。PUT 中省略继承列表是无效请求，不表示保留。角色创建申请及审批创建复用同一配置结构，父角色名称快照由服务端查询保存。


    有效权限为直接权限与全部可达父角色权限的并集，按权限 ID 去重。RoleConfiguration.effectivePermissions 每项返回 acquisition（DIRECT/INHERITED/BOTH）和 sourceRoles，来源是直接配置该权限的角色；中间传递角色不是来源，多条路径指向同一来源只显示一次。inheritedRoles 仅列当前直接父角色，编辑表单取其 id 作为 inheritedRoleIds。


    仅继承的权限只读，不能新增为重复的直接配置。已有直接权限后来因父角色配置或继承关系变化与继承重叠时保留，允许取消直接关联，继承来源仍在则继续有效。后端比较保存前的直接权限与本次最终继承关系进行校验，不依赖前端只读控件。


    按钮所属菜单按本次最终有效权限判断：可由直接配置或继承满足，不能要求把已继承菜单重复加入 permissionIds。直接权限与继承关系一起校验、一起提交，失败整次回滚，原配置不变。成功修改父角色权限或继承关系后，受影响角色及用户的下一次权限查询和 API 检查反映变更，不依赖重新登录。


    登录返回 RS256 JWT（sub、aud、iss、iat、exp、jti），不包含角色或权限。Bearer 认证、签名公钥、统一退出、账号停用及 X-Application-Code 的规则沿用 RBAC0；单应用 aud 自动选定，多应用需明确目标，管理接口要求 aud 包含 permission-center。权限中心查询当前有效授权；业务系统保留对象范围检查。


    成功响应直接返回数据，错误使用 application/problem+json。列表沿用 page/pageSize；管理端部门树和权限目录完整返回。RBAC1 增加统一身份目录接口，供接入系统按层级和部门分页查询；不在 RBAC0 项目中覆盖导入。


    权限申请按用户及候选角色的全部有效权限判断，包含所有应用中的继承权限。角色创建申请保存直接权限及父角色 ID、名称快照；详情按当前父角色计算有效权限预览。审批按最新配置校验，创建角色、直接授权、继承关系、审批结果和成功日志一起保存；不自动给员工分配角色。


    角色列表支持角色类型筛选并返回父子关系和权限统计；角色详情返回关联用户数供删除前提示。预置管理角色仅总管理员可查看，始终只读且不参与继承。我的权限按菜单和按钮返回实际配置来源，字段只用于查询展示，不增加数据库存储字段。


    修改权限或继承关系时，按拟保存的配置检查当前角色及全部直接、间接子角色。若修改后某个角色仍拥有按钮，却不再拥有其所属菜单，返回 400，提示受影响角色、按钮和菜单，整次修改不保存。其他直接或继承来源仍提供菜单时，不因该菜单依赖拒绝修改。前端预览用于提示，后端保存时执行同一校验。


    父角色快照不阻止角色删除。已删除的父角色仍显示申请中保存的父角色 ID 和名称快照，exists=false；此时申请权限预览为 null，审批创建前须改选有效业务角色。申请原配置保留，审批调整后的创建结果通过 createdRoleId 查询。
servers:
  - url: /
    description: 系统部署域名；身份接口 /auth，管理接口 /api/v1
security:
  - BearerAuth: []
tags:
  - name: 统一身份鉴权
    description: 所有接入系统共用的登录、退出、权限检查和统一身份目录。
  - name: 签名公钥
    description: 业务系统验证 JWT 的公开密钥。
  - name: 应用与权限
    description: 登记应用、菜单按钮及其关联 API。
  - name: 角色管理
    description: 配置业务角色并删除未关联用户的角色。
  - name: 用户与部门
    description: 维护用户、所属部门和组织结构。
  - name: 用户授权
    description: 单人和批量分配、撤销角色。
  - name: 我的权限
    description: 权限中心按应用汇总当前用户权限。
  - name: 操作记录
    description: 按管理范围查看重要操作。
  - name: API 登记
    description: 总管理员维护独立的 API 清单和权限关联。
  - name: 权限申请
    description: 本人申请与撤回，管理员按范围审核。
  - name: 角色创建申请
    description: 部门管理员提出配置，总管理员保存角色后完成审批。
paths:
  /auth/login:
    post:
      operationId: login
      tags:
        - 统一身份鉴权
      summary: 统一登录
      description: 使用统一用户名和密码登录。systems 填目标应用 code：课程系统为
        course-project-management，本系统为 permission-center。所有 code 必须已登记，返回 JWT 的
        aud 与此列表一致。aud 表示目标应用，不代表自动拥有该应用权限。凭据错误或账号停用均返回 401。
      x-ui-operations:
        - L01
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              username: lin.xiao
              password: DemoPassword2026
              systems:
                - course-project-management
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
              example:
                accessToken: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6InJiYWMtZXhhbXBsZSJ9.eyJpc3MiOiJodHRwczovL2lkZW50aXR5LmV4YW1wbGUuZWR1Iiwic3ViIjoiMTIiLCJhdWQiOlsiY291cnNlLXByb2plY3QtbWFuYWdlbWVudCJdLCJpYXQiOjE3OTQ0MTI4MDAsImV4cCI6MTc5NDQyMDAwMCwianRpIjoiZXhhbXBsZS1sb2dpbi0xMiJ9.mQzs-2wRjx0sc4SREwTe4T2Ed7Ai3sz69naXUEGmatXdkAh1NX4TNOvRXjzQYvCoR1knJEfi7Ryv8tXZ8Z_FDZW8JJ5Uda7rSENcs8Z_tySIc1LlSvBvg9dHbVmIvtgC1IZLyCMeAOYKBvevDIlBqVTi8WORm2vC84oAjY8NyRfYG9nerWe5DEJcYholoOjazBM9Id__jJY5WA3UVKWoRbbmKqHX0igeZ8aNQVavTjXkH1xJJDwKcdvCKqa8vYnszPFb-n86xVA67GouJISM3tvQwKFk2vIIwCWQR_jfcgcLQ2cQANclu6GQQAu9GQe1Pl8-3Mjf0ltS764oU-4a2A
                tokenType: Bearer
                expiresIn: 7200
          headers:
            Cache-Control:
              description: 不缓存当前身份或授权结果
              schema:
                type: string
                const: no-store
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      externalDocs:
        description: 课程管理系统统一身份鉴权契约
        url: https://s.apifox.cn/775094d6-9f5f-4b75-9600-2332c43948d3/api-523792399e0
      x-implementation-status: RBAC1 结构化后端已实现
  /auth/logout:
    post:
      operationId: logout
      tags:
        - 统一身份鉴权
      summary: 统一退出登录
      description: 使用当前 Bearer 令牌退出，不提交用户 ID。中心使当前令牌失效，所有使用它的接入系统后续检查均返回 401。
      x-ui-operations:
        - L02
      responses:
        "204":
          description: 当前令牌已失效，无响应正文
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      externalDocs:
        description: 课程管理系统统一身份鉴权契约
        url: https://s.apifox.cn/775094d6-9f5f-4b75-9600-2332c43948d3/api-523792400e0
      x-implementation-status: RBAC1 结构化后端已实现
  /auth/me:
    get:
      operationId: getCurrentUserAndPermissions
      tags:
        - 统一身份鉴权
      summary: 当前用户、角色与权限
      description: >-
        从令牌识别当前用户与目标应用。启用角色码映射的应用，从用户直接分配的业务角色及其所有父角色中查找该应用配置的角色码，
        去重后返回，不要求角色拥有该应用权限。没有匹配的映射时返回空数组。其他应用沿用数字角色 ID 字符串，
        只列出直接分配且为目标应用提供有效权限的角色。permissions 始终返回目标应用内去重的直接和继承权限。
        subject 为用户 ID 字符串，no 为统一账号用户名。id、departmentId、managementRole 供权限中心页面使用。
      x-ui-operations:
        - L03
      parameters:
        - $ref: "#/components/parameters/ApplicationContext"
      responses:
        "200":
          description: 当前用户在目标应用中的身份、角色和权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
              example:
                subject: "12"
                roles:
                  - "4"
                permissions:
                  - course:viewOwn
                  - course:create
                name: 林晓
                no: lin.xiao
                id: 12
                departmentId: 3
                managementRole: NONE
          headers:
            Cache-Control:
              description: 不缓存当前身份或授权结果
              schema:
                type: string
                const: no-store
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      externalDocs:
        description: 课程管理系统统一身份鉴权契约
        url: https://s.apifox.cn/775094d6-9f5f-4b75-9600-2332c43948d3/api-523792401e0
      x-implementation-status: RBAC1 继承鉴权待实现
  "/auth/permissions/{permission}":
    get:
      operationId: checkCurrentFrontendPermission
      tags:
        - 统一身份鉴权
      summary: 校验当前用户是否具备指定前端权限
      description: 检查当前用户在目标应用中的一项菜单或按钮权限，只返回 allowed。不接受 userId。权限未登记或未获授权返回
        200、allowed=false；令牌无效或账号停用返回 401。 RBAC1
        使用直接权限与全部可达祖先权限的并集；移除一条继承路径后仍有其他来源时继续允许。
      x-requirement: 核心需求 7 权限检查
      parameters:
        - $ref: "#/components/parameters/FrontendPermission"
        - $ref: "#/components/parameters/ApplicationContext"
      responses:
        "200":
          description: 单项前端权限检查结果
          headers:
            Cache-Control:
              description: 不缓存当前身份或授权结果
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionCheckResult"
              examples:
                allowed:
                  value:
                    allowed: true
                denied:
                  value:
                    allowed: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      externalDocs:
        description: 课程管理系统统一身份鉴权契约
        url: https://s.apifox.cn/775094d6-9f5f-4b75-9600-2332c43948d3/api-534170404e0
      x-implementation-status: RBAC1 继承鉴权待实现
  "/auth/api-permissions/{operationId}":
    get:
      operationId: checkCurrentApiPermission
      tags:
        - 统一身份鉴权
      summary: 判断当前用户能否调用指定 API 接口
      description: 业务后端转交当前用户的 Bearer 令牌，并从实际请求确定 operationId，不信任前端自行声明的目标接口。按目标应用查找
        API，读取其全部关联权限；当前有效角色拥有其中任意一项即 allowed=true（OR），没有关联权限则 allowed=false。API
        未登记返回 404；未获授权返回 200、allowed=false；无效令牌、退出或停用账号返回 401；检查不可用返回
        503，均不得执行操作。只检查功能权限，固定管理员职责、部门范围及业务对象范围仍由目标后端落实。 RBAC1
        的任一关联权限判断包含角色继承得到的权限，仍按目标应用隔离。
      x-requirement: 核心需求 7 权限检查
      parameters:
        - $ref: "#/components/parameters/OperationId"
        - $ref: "#/components/parameters/ApplicationContext"
      responses:
        "200":
          description: 当前用户调用目标 API 的权限
          headers:
            Cache-Control:
              description: 不缓存当前身份或授权结果
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiCheckResult"
              examples:
                allowed:
                  value:
                    operationId: listAdminCourses
                    allowed: true
                denied:
                  value:
                    operationId: listAdminCourses
                    allowed: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      externalDocs:
        description: 课程管理系统统一身份鉴权契约
        url: https://s.apifox.cn/775094d6-9f5f-4b75-9600-2332c43948d3/api-534180421e0
      x-implementation-status: RBAC1 继承鉴权待实现
  /auth/departments:
    get:
      operationId: listIdentityDepartments
      tags: [统一身份鉴权]
      summary: 分页查询统一身份部门
      description: 不传 parentId 查询根部门，传入时只查询该部门的直接子部门。keyword 匹配本层部门名称或代码，hasChildren 表示是否有直接子部门。目标应用须登记此 API 并为调用人授权。
      parameters:
        - $ref: '#/components/parameters/ApplicationContext'
        - $ref: '#/components/parameters/DirectoryKeyword'
        - name: parentId
          in: query
          description: 上级部门 ID，省略时查询根部门
          schema: { $ref: '#/components/schemas/Id' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 部门分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/IdentityDirectoryPage'
                  - properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/IdentityDepartment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
      externalDocs:
        url: https://s.apifox.cn/775094d6-9f5f-4b75-9600-2332c43948d3/538430452e0
      x-implementation-status: RBAC1 结构化后端已实现
  /auth/departments/{departmentId}/users:
    get:
      operationId: listIdentityDepartmentUsers
      tags: [统一身份鉴权]
      summary: 分页查询部门内的统一身份用户
      description: 按姓名或账号查询指定部门的启用用户。目标应用须登记此 API 并为调用人授权。
      parameters:
        - $ref: '#/components/parameters/ApplicationContext'
        - $ref: '#/components/parameters/DepartmentId'
        - $ref: '#/components/parameters/DirectoryKeyword'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 部门用户分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/IdentityDirectoryPage'
                  - properties:
                      items:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/IdentityUser'
                            - required: [departmentId, departmentName]
                              properties:
                                departmentId: { $ref: '#/components/schemas/Id' }
                                departmentName: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
      externalDocs:
        url: https://s.apifox.cn/775094d6-9f5f-4b75-9600-2332c43948d3/538430453e0
      x-implementation-status: RBAC1 结构化后端已实现
  /auth/users/{userId}:
    get:
      operationId: lookupIdentityUser
      tags: [统一身份鉴权]
      summary: 按统一身份标识查询用户
      description: 用目录返回的 userId 查询启用的组织用户，返回姓名和账号。目标应用须登记此 API 并为调用人授权。
      parameters:
        - $ref: '#/components/parameters/ApplicationContext'
        - name: userId
          in: path
          required: true
          description: 统一身份标识，与 JWT sub 一致，使用用户 ID 的十进制字符串
          schema: { $ref: '#/components/schemas/IdentitySubject' }
      responses:
        '200':
          description: 统一身份用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
      externalDocs:
        url: https://s.apifox.cn/775094d6-9f5f-4b75-9600-2332c43948d3/538437663e0
      x-implementation-status: RBAC1 结构化后端已实现
  /.well-known/jwks.json:
    get:
      operationId: getSigningPublicKeys
      tags:
        - 签名公钥
      summary: 获取 JWT 验签公钥
      description: 公开 RSA 公钥。业务系统根据 JWT 头部 kid
        选择公钥，并检查签名、签发者、时效及目标应用。只提供公钥，不返回私钥。验签不替代权限与退出失效检查。
      security: []
      responses:
        "200":
          description: JWT 签名公钥集合
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwkSet"
              example:
                keys:
                  - kty: RSA
                    use: sig
                    alg: RS256
                    kid: rbac-example
