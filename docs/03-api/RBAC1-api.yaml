      summary: 创建角色并通过或拒绝申请
      description: 仅总管理员处理 PENDING，已处理返回 409。APPROVE 在 role 中提交审核调整后的完整
        RoleConfigurationInput，含直接权限和父角色完整列表；可以改选父角色。按父角色最新配置重新计算有效权限，执行正常新建角色的业务角色、重复直接权限、菜单依赖和继承规则校验。父角色已删除、配置失效等返回
        400；重名等冲突返回 409，整次回滚，申请保持 PENDING。校验通过后，角色、直接授权、正式继承关系、申请 APPROVED
        及审批人/时间/createdRoleId 和成功日志在同一事务保存。申请原直接权限和父角色快照保留，不被审批调整覆盖；通过
        createdRoleId 读取实际创建配置。REJECT
        只更新申请和成功日志，不创建角色。创建成功后按正常流程另行给员工分配角色。读取、打开或取消编辑均不改变申请状态，无独立受理状态。
