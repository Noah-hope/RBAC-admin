components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Authorization: Bearer <accessToken>。统一登录签发的 RS256
        JWT；中心验证签名、签发者、时效、目标应用及令牌和账号状态。当前用户由令牌确定，不读取请求方指定的 userId，不从 JWT
        读取角色权限。"
  parameters:
    ApplicationId:
      name: applicationId
      in: path
      required: true
      description: 应用 ID
      schema: { $ref: '#/components/schemas/Id' }
      example: 1
    PermissionId:
      name: permissionId
      in: path
      required: true
      description: 权限 ID
      schema: { $ref: '#/components/schemas/Id' }
      example: 102
    RoleId:
      name: roleId
      in: path
      required: true
      description: 业务角色 ID
      schema: { $ref: '#/components/schemas/Id' }
      example: 8
    DepartmentId:
      name: departmentId
      in: path
      required: true
      description: 部门 ID
      schema: { $ref: '#/components/schemas/Id' }
      example: 3
    UserId:
      name: userId
      in: path
      required: true
      description: 用户 ID
      schema: { $ref: '#/components/schemas/Id' }
      example: 12
    Page:
      name: page
      in: query
      description: 页码，从 1 开始
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      description: 每页条数
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ApplicationContext:
      name: X-Application-Code
      in: header
      required: false
      description: JWT aud 仅含一个应用时可省略，多个应用时必须填本次目标 code。省略且目标不明确返回 400；指定 aud 外的应用返回
        403。管理接口固定属于 permission-center，无需此头。
      schema:
        $ref: "#/components/schemas/ApplicationCode"
      example: course-project-management
    DirectoryKeyword:
      name: keyword
      in: query
      description: 可选的搜索关键词
      schema: { $ref: '#/components/schemas/Keyword' }
    FrontendPermission:
      name: permission
      in: path
      required: true
      description: 当前应用内菜单或按钮的权限标识，与 operationId 不同。编码格式由接入系统决定（如 course:review、CV、course.view），未登记的编码返回 allowed=false。
      schema:
        type: string
        minLength: 1
        maxLength: 64
      example: course:review
    OperationId:
      name: operationId
      in: path
      required: true
      description: 业务系统 API 文档的接口标识，在目标应用内唯一。
      schema:
        $ref: "#/components/schemas/OperationId"
      example: listAdminCourses
    ApiId:
      name: apiId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
  responses:
    UserReturned:
      description: 用户信息及其已有的业务角色
      content:
        application/json:
          schema: { $ref: '#/components/schemas/User' }
          example:
            id: 12
            username: lin.xiao
            name: 林晓
            department:
              id: 3
              name: 软件工程系
            status: ACTIVE
            departmentAdministrator: false
            businessRoles:
              - id: 3
                name: 课程教师
    UserTransferred:
      description: 保存后的用户信息
      content:
        application/json:
          schema: { $ref: '#/components/schemas/User' }
          examples:
            transfer:
              summary: 调动后保留原角色
              value:
                id: 12
                username: lin.xiao
                name: 林晓
                department:
                  id: 4
                  name: 数学学院
                status: ACTIVE
                departmentAdministrator: false
                businessRoles:
                  - id: 3
                    name: 课程教师
            disable:
              summary: 停用后的账号状态
              value:
                id: 12
                username: lin.xiao
                name: 林晓
                department:
                  id: 3
                  name: 软件工程系
                status: DISABLED
                departmentAdministrator: false
                businessRoles:
                  - id: 3
                    name: 课程教师
            appoint:
              summary: 指定部门管理员后的身份
              value:
                id: 12
                username: lin.xiao
                name: 林晓
                department:
                  id: 3
                  name: 软件工程系
                status: ACTIVE
                departmentAdministrator: true
                businessRoles:
                  - id: 3
                    name: 课程教师
    BadRequest:
      description: 请求格式、字段或关联不符合要求
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:rbac-admin:problem:invalid-request
            title: 请求不符合要求
            status: 400
            code: INVALID_REQUEST
            detail: 请检查请求参数及必填字段。
    Unauthorized:
      description: 登录凭据无效，或访问凭据缺失、过期或已撤销
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:rbac-admin:problem:unauthenticated
            title: 身份校验失败
            status: 401
            code: UNAUTHENTICATED
            detail: 请检查登录信息或访问凭据。
    Forbidden:
      description: 角色无权操作、对象超出管理范围，或令牌不包含目标应用。
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            outsideScope:
              value:
                type: urn:rbac-admin:problem:outside-management-scope
                title: 超出管理范围
                status: 403
                code: OUTSIDE_MANAGEMENT_SCOPE
                detail: 请选择本部门或下级部门内的对象。
            disabled:
              value:
                type: urn:rbac-admin:problem:account-disabled
                title: 账号已停用
                status: 403
                code: ACCOUNT_DISABLED
                detail: 请联系管理员确认账号状态。
            forbidden:
              value:
                type: urn:rbac-admin:problem:forbidden
                title: 操作不被允许
                status: 403
                code: FORBIDDEN
                detail: 当前角色无权执行该操作。
            applicationMismatch:
              value:
                type: urn:rbac-admin:problem:application-mismatch
                title: 应用不匹配
                status: 403
                code: APPLICATION_MISMATCH
                detail: 当前令牌不包含目标应用，请使用该应用的统一登录入口。
    NotFound:
      description: 目标资源或必需的关联资源不存在
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:rbac-admin:problem:not-found
            title: 对象不存在
            status: 404
            code: NOT_FOUND
            detail: 请检查目标 ID 后重试。
    Conflict:
      description: 应用名称或 code、用户名、应用内权限标识、API 标识或方法与路径组合重复，或待删除角色仍关联用户。
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:rbac-admin:problem:conflict
            title: 数据已存在
            status: 409
            code: CONFLICT
            detail: 同一应用内已存在相同的权限标识，请检查后重试。
    TooManyRequests:
      description: 登录尝试过于频繁
      headers:
        Retry-After:
          description: 可再次尝试前的等待秒数
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:rbac-admin:problem:too-many-requests
            title: 登录尝试过于频繁
            status: 429
            code: TOO_MANY_REQUESTS
            detail: 请稍后再试。
    InternalError:
      description: 系统暂时无法完成操作
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:rbac-admin:problem:internal-error
            title: 系统暂时不可用
            status: 500
            code: INTERNAL_ERROR
            detail: 请稍后重试。
    ServiceUnavailable:
      description: 统一身份或权限检查暂不可用，调用方不能继续受保护操作
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:rbac-admin:problem:service-unavailable
            title: 身份或权限服务暂不可用
            status: 503
            code: SERVICE_UNAVAILABLE
            detail: 请稍后重新登录或重试操作。
  schemas:
    Id:
      type: integer
      format: int64
      minimum: 1
      maximum: 9007199254740991
      description: 数字 ID，取值范围可由浏览器安全表示。
    NullableId:
      oneOf:
        - $ref: '#/components/schemas/Id'
        - type: 'null'
    IdList:
      type: array
      uniqueItems: true
      items: { $ref: '#/components/schemas/Id' }
    RequiredIdList:
      allOf:
        - $ref: '#/components/schemas/IdList'
        - minItems: 1
    Name:
      type: string
      minLength: 1
      maxLength: 24
    Username:
      type: string
      minLength: 1
      maxLength: 32
    Keyword:
      type: string
      maxLength: 100
    Description:
      type: string
      maxLength: 48
      default: ''
    PermissionCode:
      type: string
      maxLength: 64
      pattern: '^(?:[^:\s]+:[^:\s]+|[A-Z][A-Z0-9]*)$'
      example: course:review
    ManagementRole:
      type: string
      enum: [ TOTAL_ADMIN, DEPARTMENT_ADMIN, NONE ]
    AccountStatus:
      type: string
      enum: [ ACTIVE, DISABLED ]
    PermissionType:
      type: string
      enum: [ MENU, BUTTON ]
    BatchAction:
      type: string
      enum: [ GRANT, REVOKE ]
    IdentityDirectoryPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: { type: array }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    IdentityDepartment:
      type: object
      required: [id, code, name, parentId, hasChildren]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        code:
          type: string
          description: 部门 ID 的十进制字符串
        name: { type: string }
        parentId:
          anyOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        hasChildren: { type: boolean }
    IdentitySubject:
      type: string
      pattern: '^[1-9][0-9]{0,15}$'
      description: 与 JWT sub 一致的用户 ID 字符串，数值不超过 9007199254740991
    IdentityUser:
      type: object
      required: [userId, no, name]
      properties:
        userId: { $ref: '#/components/schemas/IdentitySubject' }
        no:
          type: string
          description: 统一账号，作为工号或学号
        name: { type: string }
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
        - systems
      properties:
        username:
          description: 统一账号。兼容 JSON 整数形式的学号，带前导零时使用字符串。
          oneOf:
            - $ref: '#/components/schemas/Username'
            - type: integer
        password:
          type: string
          minLength: 1
          format: password
          writeOnly: true
        systems:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ApplicationCode"
          description: 本次登录的目标应用。同一账号可登录所有已接入系统，各应用功能权限分别计算。
    LoginResult:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          minLength: 1
          description: RS256 JWT，不包含角色和权限。
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          minimum: 1
          description: 有效时长，单位秒。
    Application:
      type: object
      required:
        - id
        - name
        - code
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          $ref: "#/components/schemas/Name"
        code:
          $ref: "#/components/schemas/ApplicationCode"
    ApplicationInput:
      type: object
      additionalProperties: false
      required: [ name ]
      properties:
        name: { $ref: '#/components/schemas/Name' }
    ApplicationPermissions:
      type: object
      required: [ applicationId, applicationName, menus ]
      properties:
        applicationId: { $ref: '#/components/schemas/Id' }
        applicationName: { $ref: '#/components/schemas/Name' }
        menus:
          type: array
          items: { $ref: '#/components/schemas/MenuNode' }
        applicationCode:
          $ref: "#/components/schemas/ApplicationCode"
    MenuNode:
      type: object
      required: [ id, name, code, buttons ]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { $ref: '#/components/schemas/Name' }
        code: { $ref: '#/components/schemas/PermissionCode' }
        buttons:
          type: array
          items: { $ref: '#/components/schemas/PermissionRef' }
        apiCount:
          type: integer
          minimum: 0
          readOnly: true
          description: 应用权限管理中返回的关联 API 数量。
    PermissionRef:
      type: object
      required: [ id, name, code ]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { $ref: '#/components/schemas/Name' }
        code: { $ref: '#/components/schemas/PermissionCode' }
        apiCount:
          type: integer
          minimum: 0
          readOnly: true
          description: 应用权限管理中返回的关联 API 数量。
    Permission:
      allOf:
        - $ref: '#/components/schemas/PermissionRef'
        - type: object
          required: [ applicationId, type, parentId, apis ]
          properties:
            applicationId: { $ref: '#/components/schemas/Id' }
            type: { $ref: '#/components/schemas/PermissionType' }
            parentId: { $ref: '#/components/schemas/NullableId' }
            apis:
              type: array
              items:
                $ref: "#/components/schemas/Api"
    PermissionCreate:
      oneOf:
        - title: 新增菜单权限
          type: object
          additionalProperties: false
          required:
            - name
            - code
            - type
          properties:
            name:
              $ref: "#/components/schemas/Name"
            code:
              $ref: "#/components/schemas/PermissionCode"
            type:
              type: string
              const: MENU
            parentId:
              type: "null"
            apiIds:
              $ref: "#/components/schemas/IdList"
              default: []
              description: 已登记且属于同一应用的 API ID，可为空；可被其他权限同时引用。
        - title: 新增按钮权限
          type: object
          additionalProperties: false
          required:
            - name
            - code
            - type
            - parentId
          properties:
            name:
              $ref: "#/components/schemas/Name"
            code:
              $ref: "#/components/schemas/PermissionCode"
            type:
              type: string
              const: BUTTON
            parentId:
              $ref: "#/components/schemas/Id"
            apiIds:
              $ref: "#/components/schemas/IdList"
              default: []
              description: 已登记且属于同一应用的 API ID，可为空；可被其他权限同时引用。
    PermissionUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { $ref: '#/components/schemas/Name' }
        code: { $ref: '#/components/schemas/PermissionCode' }
        apiIds:
          $ref: "#/components/schemas/IdList"
          description: 省略保留关联，提供则完整替换，[] 只解除全部关联，保留 API 登记及其他权限关联。
    RoleRef:
      type: object
      required: [ id, name ]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { $ref: '#/components/schemas/Name' }
    RoleApplicationSummary:
      type: object
      required: [ applicationId, applicationName, permissionCount ]
      properties:
        applicationId: { $ref: '#/components/schemas/Id' }
        applicationName: { $ref: '#/components/schemas/Name' }
        permissionCount: { type: integer, minimum: 1 }
    DepartmentRef:
      type: object
      required: [ id, name ]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { $ref: '#/components/schemas/Name' }
    Department:
      allOf:
        - $ref: '#/components/schemas/DepartmentRef'
        - type: object
          required: [ parentId ]
          properties:
            parentId: { $ref: '#/components/schemas/NullableId' }
    DepartmentNode:
      allOf:
        - $ref: '#/components/schemas/Department'
        - type: object
          required: [ children ]
          properties:
            children:
              type: array
              items: { $ref: '#/components/schemas/DepartmentNode' }
    DepartmentTree:
      type: object
      required: [ departments ]
      properties:
        departments:
          type: array
          items: { $ref: '#/components/schemas/DepartmentNode' }
    DepartmentInput:
      type: object
      additionalProperties: false
      required: [ name, parentId ]
      properties:
        name: { $ref: '#/components/schemas/Name' }
        parentId: { $ref: '#/components/schemas/NullableId' }
    DepartmentUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { $ref: '#/components/schemas/Name' }
        parentId: { $ref: '#/components/schemas/NullableId' }
    User:
      type: object
      required:
        [
          id,
          username,
          name,
          department,
          status,
          departmentAdministrator,
          businessRoles
        ]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        username: { $ref: '#/components/schemas/Username' }
        name: { $ref: '#/components/schemas/Name' }
        department: { $ref: '#/components/schemas/DepartmentRef' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        departmentAdministrator: { type: boolean }
        businessRoles:
          type: array
          items: { $ref: '#/components/schemas/RoleRef' }
    UserCreate:
      type: object
      additionalProperties: false
      required:
        - username
        - name
        - departmentId
        - initialPassword
      properties:
        username: { $ref: '#/components/schemas/Username' }
        name: { $ref: '#/components/schemas/Name' }
        departmentId: { $ref: '#/components/schemas/Id' }
        status:
          $ref: '#/components/schemas/AccountStatus'
          default: ACTIVE
        departmentAdministrator:
          type: boolean
          description: 仅总管理员可提交，省略时创建为普通用户。
        initialPassword:
          type: string
          minLength: 1
          format: password
          writeOnly: true
          description: 新增用户表单填写的初始密码。仅传输和校验一次，数据库保存密码摘要，日志不得包含密码。
    UserCreated:
      type: object
      required:
        - user
      properties:
        user: { $ref: '#/components/schemas/User' }
    UserUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        username: { $ref: '#/components/schemas/Username' }
        name: { $ref: '#/components/schemas/Name' }
        departmentId:
          $ref: '#/components/schemas/Id'
          description: 仅总管理员可提交。
        status: { $ref: '#/components/schemas/AccountStatus' }
        departmentAdministrator:
          type: boolean
          description: 仅总管理员可提交，true 分配部门管理员角色，false 撤销该角色。
    ReplaceUserRoles:
      type: object
      additionalProperties: false
      required: [ roleIds ]
      properties:
        roleIds: { $ref: '#/components/schemas/IdList' }
    UserRoleResult:
      type: object
      required: [ userId, roleIds ]
      properties:
        userId: { $ref: '#/components/schemas/Id' }
        roleIds: { $ref: '#/components/schemas/IdList' }
    BatchRoleChange:
      type: object
      additionalProperties: false
      required: [ action, userIds, roleIds ]
      properties:
        action: { $ref: '#/components/schemas/BatchAction' }
        userIds: { $ref: '#/components/schemas/RequiredIdList' }
        roleIds: { $ref: '#/components/schemas/RequiredIdList' }
    BatchRoleResult:
      type: object
      required: [ action, affectedUsers ]
      properties:
        action: { $ref: '#/components/schemas/BatchAction' }
        affectedUsers:
          type: integer
          minimum: 0
          description: 业务角色实际发生变化的用户数。
    MyPermissions:
      type: object
      required:
        - businessRoles
        - applications
      properties:
        businessRoles:
          type: array
          items:
            $ref: "#/components/schemas/RoleRef"
        applications:
          type: array
          items:
            $ref: "#/components/schemas/MyApplicationPermissions"
    OperationLog:
      type: object
      required:
        [
          id,
          occurredAt,
          actorName,
          action,
          targetNames,
          detail,
          result
        ]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        occurredAt: { type: string, format: date-time }
        actorName: { type: string }
        action: { type: string }
        targetNames:
          type: array
          items: { type: string }
        detail: { type: string }
        result: { type: string, enum: [ SUCCESS, FAILURE ] }
    PermissionCheckResult:
      type: object
      required: [ allowed ]
      properties:
        allowed: { type: boolean }
    PageMetadata:
      type: object
      required: [ page, pageSize, total ]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    ApplicationPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [ items ]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Application' }
    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [ items ]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/User' }
    OperationLogPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [ items ]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/OperationLog' }
    Problem:
      type: object
      required: [ type, title, status, code, detail ]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - UNAUTHENTICATED
            - FORBIDDEN
            - ACCOUNT_DISABLED
            - OUTSIDE_MANAGEMENT_SCOPE
            - APPLICATION_MISMATCH
            - NOT_FOUND
            - CONFLICT
            - TOO_MANY_REQUESTS
            - INTERNAL_ERROR
            - SERVICE_UNAVAILABLE
        detail: { type: string }
    ApplicationCode:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[a-z][a-z0-9_-]*$
      description: 稳定的系统接入标识，供 systems 和 aud 使用。
      example: course-project-management
    OperationId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^\S+$
      example: reviewCourse
    HttpMethod:
      type: string
      enum:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - HEAD
        - OPTIONS
      example: POST
    AuthUser:
      type: object
      required:
        - subject
        - roles
        - permissions
        - name
        - no
      properties:
        subject:
          type: string
          minLength: 1
          description: 用户数字 ID 的字符串形式，跨应用不变。
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
          description: >-
            启用映射时返回直接和继承业务角色对应的应用角色码，按码去重并排序。其他应用返回直接分配且提供有效权限的角色 ID 字符串，
            可包含权限中心预置管理角色。
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PermissionCode"
          description: 当前应用内去重的有效菜单、按钮权限，包含直接与全部继承来源。
        name:
          $ref: "#/components/schemas/Name"
        no:
          $ref: "#/components/schemas/Username"
          description: 统一账号用户名，可采用学号或工号。
        id:
          $ref: "#/components/schemas/Id"
        departmentId:
          $ref: "#/components/schemas/NullableId"
        managementRole:
          $ref: "#/components/schemas/ManagementRole"
    ApplicationCreate:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          $ref: "#/components/schemas/Name"
        code:
          $ref: "#/components/schemas/ApplicationCode"
    ApiInput:
      type: object
      additionalProperties: false
      required:
        - operationId
        - httpMethod
        - path
      properties:
        operationId:
          $ref: "#/components/schemas/OperationId"
        httpMethod:
          $ref: "#/components/schemas/HttpMethod"
        path:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^/[^?#\s]*$
          description: 不含域名和查询参数的请求路径模板。
          example: /courses/{courseId}/review
    Api:
      type: object
      required:
        - id
        - applicationId
        - operationId
        - httpMethod
        - path
        - permissionIds
      properties:
        id:
          $ref: "#/components/schemas/Id"
        applicationId:
          $ref: "#/components/schemas/Id"
        operationId:
          $ref: "#/components/schemas/OperationId"
        httpMethod:
          $ref: "#/components/schemas/HttpMethod"
        path:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^/[^?#\s]*$
          description: 不含域名和查询参数的请求路径模板。
          example: /courses/{courseId}/review
        permissionIds:
          $ref: "#/components/schemas/IdList"
          description: 全部关联权限 ID，可为空。权限必须与 API 属于同一应用。
    ApiCheckResult:
      type: object
      required:
        - operationId
        - allowed
      properties:
        operationId:
          $ref: "#/components/schemas/OperationId"
        allowed:
          type: boolean
    JwkSet:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RsaPublicJwk"
    RsaPublicJwk:
      type: object
      additionalProperties: false
      required:
        - kty
        - use
        - alg
        - kid
        - n
        - e
      properties:
        kty:
          type: string
          const: RSA
        use:
          type: string
          const: sig
        alg:
          type: string
          const: RS256
        kid:
          type: string
          minLength: 1
        n:
          type: string
          minLength: 1
          description: RSA 公钥模数，Base64URL 编码。
        e:
          type: string
          minLength: 1
          description: RSA 公钥指数，Base64URL 编码。
    ApiUpdate:
      type: object
      additionalProperties: false
      properties:
        operationId:
          $ref: "#/components/schemas/OperationId"
        httpMethod:
          $ref: "#/components/schemas/HttpMethod"
        path:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^/[^?#\s]*$
          description: 不含域名和查询参数的请求路径模板。
          example: /courses/{courseId}/review
      minProperties: 1
    ApiPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Api"
    PermissionSummary:
      type: object
      required:
        - id
        - applicationId
        - name
        - code
        - type
        - parentId
      properties:
        id:
          $ref: "#/components/schemas/Id"
        applicationId:
          $ref: "#/components/schemas/Id"
        name:
          $ref: "#/components/schemas/Name"
        code:
          $ref: "#/components/schemas/PermissionCode"
        type:
          $ref: "#/components/schemas/PermissionType"
        parentId:
          $ref: "#/components/schemas/NullableId"
    PermissionCatalogApplication:
      type: object
      required:
        - id
        - name
        - code
        - permissions
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          $ref: "#/components/schemas/Name"
        code:
          $ref: "#/components/schemas/ApplicationCode"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionSummary"
    PermissionCatalog:
      type: object
      required:
        - applications
      properties:
        applications:
          type: array
          items:
            $ref: "#/components/schemas/PermissionCatalogApplication"
    RequestablePermissionGroup:
      type: object
      required:
        - menu
        - permissions
      properties:
        menu:
          $ref: "#/components/schemas/PermissionSummary"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionSummary"
    RequestableApplication:
      type: object
      required:
        - id
        - name
        - code
        - groups
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          $ref: "#/components/schemas/Name"
        code:
          $ref: "#/components/schemas/ApplicationCode"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/RequestablePermissionGroup"
    RequestablePermissions:
      type: object
      required:
        - applications
      properties:
        applications:
          type: array
          items:
            $ref: "#/components/schemas/RequestableApplication"
    PermissionRequestStatus:
      type: string
      enum:
        - PENDING
        - APPROVED
        - REJECTED
        - SATISFIED
        - WITHDRAWN
    PermissionRequestInput:
      type: object
      required:
        - permissionId
        - reason
      properties:
        permissionId:
          $ref: "#/components/schemas/Id"
        reason:
          type: string
          minLength: 1
          maxLength: 500
      additionalProperties: false
    PermissionRequestReview:
      oneOf:
        - type: object
          required:
            - decision
            - roleId
          properties:
            decision:
              type: string
              const: APPROVE
            roleId:
              $ref: "#/components/schemas/Id"
          additionalProperties: false
        - type: object
          required:
            - decision
          properties:
            decision:
              type: string
              const: REJECT
          additionalProperties: false
    PermissionRequest:
      type: object
      required:
        - id
        - applicantUserId
        - applicantName
        - applicantDepartmentId
        - permission
        - reason
        - status
        - reviewerUserId
        - approvedRoleId
        - createdAt
        - reviewedAt
      properties:
        id:
          $ref: "#/components/schemas/Id"
        applicantUserId:
          $ref: "#/components/schemas/Id"
        applicantName:
          $ref: "#/components/schemas/Name"
        applicantDepartmentId:
          $ref: "#/components/schemas/NullableId"
        permission:
          $ref: "#/components/schemas/PermissionSummary"
        reason:
          type: string
          minLength: 1
          maxLength: 500
        status:
          $ref: "#/components/schemas/PermissionRequestStatus"
        reviewerUserId:
          $ref: "#/components/schemas/NullableId"
        approvedRoleId:
          $ref: "#/components/schemas/NullableId"
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type:
            - string
            - "null"
          format: date-time
    RoleApprovalOption:
      type: object
      required:
        - role
        - selectable
        - extraPermissionIds
      properties:
        role:
          $ref: "#/components/schemas/RoleConfiguration"
        selectable:
          type: boolean
          description: 候选业务角色的全部有效权限包含申请权限，且无无关权限时为 true；覆盖所有应用的直接与继承权限。审批时重新校验。
        extraPermissionIds:
          $ref: "#/components/schemas/IdList"
          description: 候选角色全部有效权限扣除申请人已有有效权限、申请权限及必要所属菜单后剩余的权限 ID，按 ID 升序；非空时不可选择。
    PermissionRequestDetails:
      allOf:
        - $ref: "#/components/schemas/PermissionRequest"
        - type: object
          required: []
          properties:
            approvalRoles:
              type: array
              items:
                $ref: "#/components/schemas/RoleApprovalOption"
    PermissionRequestPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PermissionRequest"
    RoleCreationRequestStatus:
      type: string
      enum:
        - PENDING
        - APPROVED
        - REJECTED
    RoleCreationRequest:
      type: object
      required:
        - id
        - applicantUserId
        - applicantName
        - name
        - description
        - permissionIds
        - status
        - reviewerUserId
        - createdRoleId
        - createdAt
        - reviewedAt
        - inheritedRoles
      properties:
        id:
          $ref: "#/components/schemas/Id"
        applicantUserId:
          $ref: "#/components/schemas/Id"
        applicantName:
          $ref: "#/components/schemas/Name"
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
        permissionIds:
          $ref: "#/components/schemas/IdList"
          description: 申请提交时拟配置的直接权限 ID。
        status:
          $ref: "#/components/schemas/RoleCreationRequestStatus"
        reviewerUserId:
          $ref: "#/components/schemas/NullableId"
        createdRoleId:
          $ref: "#/components/schemas/NullableId"
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type:
            - string
            - "null"
          format: date-time
        inheritedRoles:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RequestInheritedRole"
          description: 申请保存的父角色选择和名称快照，按 ID 排序。编辑时取 id 构成 inheritedRoleIds；没有父角色时返回 []。
      description: 申请提交时的原始角色配置及审批结果。审批可调整实际创建配置，但不覆盖原申请的直接权限或父角色快照；通过后由 createdRoleId
        查询实际创建角色。
    RoleCreationReview:
      oneOf:
        - type: object
          required:
            - decision
            - role
          properties:
            decision:
              type: string
              const: APPROVE
            role:
              $ref: "#/components/schemas/RoleConfigurationInput"
          additionalProperties: false
        - type: object
          required:
            - decision
          properties:
            decision:
              type: string
              const: REJECT
          additionalProperties: false
    RoleCreationRequestPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/RoleCreationRequest"
    RoleConfigurationInput:
      type: object
      additionalProperties: false
      required:
        - name
        - permissionIds
        - inheritedRoleIds
      properties:
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
        permissionIds:
          $ref: "#/components/schemas/IdList"
          description: 最终直接权限 ID 列表；[] 表示无直接权限。按钮的所属菜单可以通过最终继承权限满足，不能将全部有效权限回填本字段。
        inheritedRoleIds:
          $ref: "#/components/schemas/IdList"
          description: 最终直接父角色 ID 列表；[] 表示不继承父角色，编辑已有角色时解除全部继承。全部必须是存在的 BUSINESS
            角色，不得含自身、重复项或造成循环。
      description: RBAC1 角色创建、编辑、角色创建申请及审批创建共用的配置。permissionIds 为直接权限，inheritedRoleIds
        为父角色完整列表；两个列表均必填，[] 表示无相应配置。申请人和父角色名称快照由服务端取得，不接受客户端提交。
    PermissionAcquisition:
      type: string
      enum:
        - DIRECT
        - INHERITED
        - BOTH
      description: 相对于当前角色或拟创建角色的获得方式：直接配置、继承，或二者同时存在。
    EffectiveRolePermission:
      allOf:
        - $ref: "#/components/schemas/PermissionSummary"
        - type: object
          required:
            - acquisition
            - sourceRoles
          properties:
            acquisition:
              $ref: "#/components/schemas/PermissionAcquisition"
            sourceRoles:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                $ref: "#/components/schemas/RoleRef"
              description: 直接配置该权限的全部来源角色，按角色 ID 去重排序。DIRECT 包含当前角色；INHERITED 只含祖先配置角色；BOTH
                同时包含当前角色和祖先。
    RoleConfigurationSummary:
      allOf:
        - $ref: "#/components/schemas/RoleRef"
        - type: object
          required:
            - description
            - applications
            - inheritedRoles
            - roleType
            - inheritedByRoles
            - directPermissionCount
            - effectivePermissionCount
          properties:
            description:
              $ref: "#/components/schemas/Description"
            applications:
              type: array
              description: 按全部有效权限汇总应用；同一权限只统计一次，包括继承带来的应用和权限。
              items:
                $ref: "#/components/schemas/RoleApplicationSummary"
            inheritedRoles:
              type: array
              uniqueItems: true
              items:
                $ref: "#/components/schemas/RoleRef"
              description: 当前角色直接继承的业务角色，按 ID 排序；不是全部祖先。预置管理角色返回空数组。
            roleType:
              $ref: "#/components/schemas/RoleType"
            inheritedByRoles:
              type: array
              uniqueItems: true
              items:
                $ref: "#/components/schemas/RoleRef"
              readOnly: true
              description: 直接继承当前角色的业务角色，按 ID 排序；不是全部后代。预置管理角色返回空数组。
            directPermissionCount:
              type: integer
              minimum: 0
              readOnly: true
              description: 直接配置的去重权限数，包括与继承重叠的已有直接配置。
            effectivePermissionCount:
              type: integer
              minimum: 0
              readOnly: true
              description: 全部直接与继承权限去重后的数量。减去 directPermissionCount 即为仅继承的数量。
    RoleConfiguration:
      allOf:
        - $ref: "#/components/schemas/RoleConfigurationSummary"
        - type: object
          required:
            - permissionIds
            - effectivePermissions
            - assignedUserCount
          properties:
            permissionIds:
              $ref: "#/components/schemas/IdList"
              description: 当前直接配置权限 ID，与继承权限分开。
            effectivePermissions:
              type: array
              items:
                $ref: "#/components/schemas/EffectiveRolePermission"
              description: 全部有效权限，按权限 ID 去重排序；来源按角色 ID 去重，不返回冗余继承路径。
            assignedUserCount:
              type: integer
              minimum: 0
              readOnly: true
              description: 直接关联当前角色的用户数，停用用户也计入；供删除前展示提示。实际删除时仍重新校验。
    RoleConfigurationPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/RoleConfigurationSummary"
    RoleType:
      type: string
      enum:
        - BUSINESS
        - TOTAL_ADMIN
        - DEPARTMENT_ADMIN
      description: 业务角色或预置管理角色；由服务端确定，不作为创建或编辑请求字段。
    MyPermissionRef:
      allOf:
        - $ref: "#/components/schemas/PermissionRef"
        - type: object
          required:
            - sourceRoles
          properties:
            sourceRoles:
              type: array
              uniqueItems: true
              items:
                $ref: "#/components/schemas/RoleRef"
              readOnly: true
              description: 直接配置此权限的全部来源角色，按角色 ID 去重排序；中间传递角色不列入。登录后即可使用且无角色配置来源的基础功能返回 []。
    MyMenuNode:
      allOf:
        - $ref: "#/components/schemas/MyPermissionRef"
        - type: object
          required:
            - buttons
          properties:
            buttons:
              type: array
              items:
                $ref: "#/components/schemas/MyPermissionRef"
    MyApplicationPermissions:
      type: object
      required:
        - applicationId
        - applicationName
        - menus
      properties:
        applicationId:
          $ref: "#/components/schemas/Id"
        applicationName:
          $ref: "#/components/schemas/Name"
        menus:
          type: array
          items:
            $ref: "#/components/schemas/MyMenuNode"
        applicationCode:
          $ref: "#/components/schemas/ApplicationCode"
    RequestInheritedRole:
      type: object
      required:
        - id
        - name
        - exists
      properties:
        id:
          $ref: "#/components/schemas/Id"
          description: 申请保存的父角色 ID 快照。
        name:
          $ref: "#/components/schemas/Name"
          description: 申请提交时的父角色名称快照；不随角色改名或删除而改变。
        exists:
          type: boolean
          readOnly: true
          description: 当前是否仍存在该父角色，由服务端查询计算；false 时保留原 ID 和名称供查看、调整。
      description: 角色创建申请保存的父角色选择；父角色不设强制外键，历史申请不阻止角色删除。
    RequestedRolePermission:
      allOf:
        - $ref: "#/components/schemas/PermissionSummary"
        - type: object
          required:
            - acquisition
            - sourceRoles
          properties:
            acquisition:
              $ref: "#/components/schemas/PermissionAcquisition"
              description: 相对于拟创建角色：DIRECT 为申请直接配置，INHERITED 为父角色提供。父角色配置变化导致申请直接权限与继承重叠时展示
                BOTH，创建前须调整重复直接配置。
            sourceRoles:
              type: array
              uniqueItems: true
              items:
                $ref: "#/components/schemas/RoleRef"
              readOnly: true
              description: 实际直接配置继承权限的已有角色，按 ID 去重排序，中间传递角色不列入。DIRECT 返回
                []，界面显示“本次申请直接配置”；INHERITED/BOTH 列继承来源，不为尚未创建的角色伪造 ID。
    RoleCreationRequestDetails:
      allOf:
        - $ref: "#/components/schemas/RoleCreationRequest"
        - type: object
          required:
            - effectivePermissions
          properties:
            effectivePermissions:
              type:
                - array
                - "null"
              items:
                $ref: "#/components/schemas/RequestedRolePermission"
              readOnly: true
              description: 按原申请直接权限及父角色当前配置计算的去重权限预览，不保存权限副本。任一父角色已删除时返回 null，不展示不完整结果；结合
                inheritedRoles[].exists
                提示重新选择。全部父角色存在时，即使因后续配置变化产生重复直接权限，也返回预览供调整，实际创建仍须通过新建角色校验。
