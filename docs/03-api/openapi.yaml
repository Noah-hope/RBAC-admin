openapi: 3.1.0
info:
  title: RBAC 权限中心 API
  version: 1.0.0
  description: |
    首版接口契约，依据已确认的界面操作清单。x-ui-operations 记录对应的界面操作编号。

    权限中心用户通过会话令牌访问。总管理员全局管理，部门管理员管理本人所属部门及下级部门。
    业务系统使用独立的应用令牌查询本应用的功能权限。应用和角色使用系统生成的数字 ID。

    列表统一使用 page 和 pageSize 分页，先按权限范围和查询条件过滤，再计算 total 和分页。
    部门树和应用权限树以完整层级返回。应用、角色和用户列表按 ID 升序，操作记录按时间和 ID 降序。

    角色权限配置、角色分配和撤销的变更与成功记录一起保存。保存失败时保留原授权结果。
    首版路径为 /api/v1。兼容的新增字段和接口沿用该路径，破坏兼容的变更使用新版本路径。
servers:
  - url: /api/v1
    description: 权限中心 API 基础路径
security:
  - SessionToken: []
tags:
  - name: 登录与退出
    description: 创建、结束会话及恢复当前用户身份。
  - name: 应用与权限
    description: 登记业务应用、菜单和按钮权限。
  - name: 角色管理
    description: 查询业务角色，保存角色在各应用中的权限。
  - name: 用户与部门
    description: 维护用户账号、所属部门及组织结构。
  - name: 用户授权
    description: 查看用户已有角色，进行单人或批量授权。
  - name: 我的权限
    description: 查询当前用户在各应用中的有效业务权限。
  - name: 操作记录
    description: 按管理员范围查看和搜索重要操作。
  - name: 业务系统接入
    description: 业务系统按应用和权限标识检查用户权限。
paths:
  /sessions:
    post:
      operationId: createSession
      tags: [登录与退出]
      summary: 用户登录
      description: |
        使用权限中心用户名和密码登录。凭据无效返回 401，凭据正确但账号停用返回 403。
        成功后返回会话令牌和当前用户，前端按管理角色显示可用页面。连续失败的登录尝试应限流。
      x-ui-operations: [L01]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { username: lin.xiao, password: DemoPassword2026 }
      responses:
        '201':
          description: 已创建登录会话
          headers:
            Cache-Control:
              description: 会话令牌响应禁止缓存
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
              example:
                accessToken: example-session-token
                expiresAt: '2026-11-10T12:00:00+08:00'
                user: { id: 12, username: lin.xiao, name: 林晓, departmentId: 3, managementRole: NONE }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /sessions/current:
    delete:
      operationId: deleteCurrentSession
      tags: [登录与退出]
      summary: 退出登录
      description: 已登录用户可以退出。服务端撤销当前会话，令牌随即失效。
      x-ui-operations: [L02]
      responses:
        '204': { description: 已退出登录 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /me:
    get:
      operationId: getCurrentUser
      tags: [登录与退出]
      summary: 获取当前登录用户
      description: 已登录用户可以查询自身身份。页面刷新后可用该结果恢复当前用户和可用导航。
      x-ui-operations: [L01]
      responses:
        '200':
          description: 当前用户身份
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionUser' }
              example: { id: 12, username: lin.xiao, name: 林晓, departmentId: 3, managementRole: NONE }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /applications:
    get:
      operationId: listApplications
      tags: [应用与权限]
      summary: 查询应用列表
      description: 总管理员可查看应用，并在配置角色时使用同一列表选择应用。
      x-ui-operations: [A01, R02, R03]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 已登记应用的分页结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationPage' }
              example:
                items: [{ id: 1, name: OA 协同办公 }]
                page: 1
                pageSize: 20
                total: 1
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createApplication
      tags: [应用与权限]
      summary: 新增应用
      description: 总管理员填写应用名称。系统生成应用 ID，该 ID 供业务系统接入时使用。
      x-ui-operations: [A02]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationInput' }
            example: { name: 工单系统 }
      responses:
        '201':
          description: 应用已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
              example: { id: 4, name: 工单系统 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /applications/{applicationId}:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    patch:
      operationId: updateApplication
      tags: [应用与权限]
      summary: 修改应用名称
      description: 总管理员可修改应用名称。应用 ID 保持固定。
      x-ui-operations: [A03]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationInput' }
            example: { name: 服务工单 }
      responses:
        '200':
          description: 应用已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
              example: { id: 4, name: 服务工单 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /applications/{applicationId}/permissions:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      operationId: getApplicationPermissionTree
      tags: [应用与权限]
      summary: 查看应用权限树
      description: 总管理员可查询应用内的菜单和按钮。应用目录和角色配置共用该权限树。
      x-ui-operations: [A04, R02, R03]
      responses:
        '200':
          description: 应用内的完整权限树
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationPermissions' }
              example:
                applicationId: 1
                applicationName: OA 协同办公
                menus:
                  - id: 101
                    name: 公文管理
                    code: 'document:view'
                    buttons: [{ id: 102, name: 审批公文, code: 'document:approve' }]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createPermission
      tags: [应用与权限]
      summary: 登记菜单或按钮权限
      description: |
        总管理员可登记权限。标识格式为 资源:操作，同一应用内唯一。
        新增按钮时，parentId 必须指向同一应用内的菜单。新增菜单时 parentId 可省略或填 null。
        保存后，新权限出现在该应用的权限树，并可授予业务角色。
      x-ui-operations: [A05]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionCreate' }
            examples:
              menu:
                value: { name: 公文管理, code: 'document:view', type: MENU }
              button:
                value: { name: 审批公文, code: 'document:approve', type: BUTTON, parentId: 101 }
      responses:
        '201':
          description: 权限已登记
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Permission' }
              example: { id: 102, applicationId: 1, name: 审批公文, code: 'document:approve', type: BUTTON, parentId: 101 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /applications/{applicationId}/permissions/{permissionId}:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
      - $ref: '#/components/parameters/PermissionId'
    patch:
      operationId: updatePermission
      tags: [应用与权限]
      summary: 修改权限名称或标识
      description: |
        总管理员可修改权限名称或标识。权限 ID、所属应用、类型和所属菜单保持固定，已有角色关联继续有效。
        修改标识后，业务系统的下一次权限检查按新标识匹配。
      x-ui-operations: [A06]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionUpdate' }
            example: { name: 审批公文申请 }
      responses:
        '200':
          description: 权限已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Permission' }
              example: { id: 102, applicationId: 1, name: 审批公文申请, code: 'document:approve', type: BUTTON, parentId: 101 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /roles:
    get:
      operationId: listRoles
      tags: [角色管理]
      summary: 查看或搜索业务角色
      description: |
        总管理员可查看角色列表。部门管理员可调用同一接口取得业务角色选项。
        返回角色概要和已授权应用统计。角色的具体权限由总管理员查询。
      x-ui-operations: [R01, G02, G04, G05]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          description: 按角色名称搜索
          schema: { $ref: '#/components/schemas/Keyword' }
      responses:
        '200':
          description: 业务角色分页结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RolePage' }
              example:
                items:
                  - id: 8
                    name: 公文审批员
                    description: 处理 OA 公文审批
                    applications: [{ applicationId: 1, applicationName: OA 协同办公, permissionCount: 2 }]
                page: 1
                pageSize: 20
                total: 1
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createRole
      tags: [角色管理]
      summary: 新增业务角色
      description: |
        总管理员可创建业务角色。系统生成角色 ID。一次保存可包含多个应用的权限。
        选中的按钮和所属菜单一并提交，允许以空权限列表创建角色。
        引用不存在的权限或缺少所属菜单时返回 400。
      x-ui-operations: [R02]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
            example: { name: 公文审批员, description: 处理 OA 公文审批, permissionIds: [101, 102] }
      responses:
        '201': { $ref: '#/components/responses/RoleCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /roles/{roleId}:
    parameters:
      - $ref: '#/components/parameters/RoleId'
    get:
      operationId: getRole
      tags: [角色管理]
      summary: 查看角色信息和已选权限
      description: 总管理员可查看角色信息和全部已选权限 ID。页面配合各应用的权限树恢复勾选。
      x-ui-operations: [R03]
      responses:
        '200': { $ref: '#/components/responses/RoleReturned' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: updateRole
      tags: [角色管理]
      summary: 保存角色信息和全部权限
      description: |
        总管理员提交角色名称、说明和完整的权限 ID 列表。角色 ID 保持固定。
        同一次保存替换该角色在所有应用中的权限配置。先校验全部权限，成功后整体生效并记录操作。
        引用不存在的权限或缺少所属菜单时返回 400。
      x-ui-operations: [R04]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
            example: { name: 公文审批员, description: 审批公文并查看员工档案, permissionIds: [101, 102, 201] }
      responses:
        '200': { $ref: '#/components/responses/RoleReturned' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteRole
      tags: [角色管理]
      summary: 删除未关联用户的业务角色
      x-ui-operations: [R05]
      description: |
        仅总管理员可删除业务角色。预置管理角色不能通过本接口删除，返回 404。
        角色仍关联任何用户（包括停用账号）时返回 409，提示关联人数，须先撤销用户关联。
        未关联用户时，在同一事务中删除角色权限关联和角色，并记录包含角色名称的操作日志。
        保留权限本身、用户和历史日志。
      responses:
        '204': { description: 角色已删除，无响应正文 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /departments:
    get:
      operationId: getDepartmentTree
      tags: [用户与部门]
      summary: 查看部门结构
      description: 总管理员查看完整组织树。部门管理员以本部门为根查看可管理的组织树。
      x-ui-operations: [D01, D02, D03, D04, D05, D06, D07]
      responses:
        '200':
          description: 管理范围内的部门树
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentTree' }
              example:
                departments:
                  - id: 2
                    name: 行政部
                    parentId: 1
                    children: [{ id: 3, name: 综合办公室, parentId: 2, children: [] }]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createDepartment
      tags: [用户与部门]
      summary: 新增部门
      description: 总管理员在组织树中新增公司、分公司或部门节点。parentId 为 null 时创建顶层节点。
      x-ui-operations: [D02]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentInput' }
            example: { name: 档案室, parentId: 2 }
      responses:
        '201':
          description: 部门已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Department' }
              example: { id: 5, name: 档案室, parentId: 2 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /departments/{departmentId}:
    parameters:
      - $ref: '#/components/parameters/DepartmentId'
    patch:
      operationId: updateDepartment
      tags: [用户与部门]
      summary: 修改部门信息
      description: 总管理员可修改部门名称或上级。上级须为已有部门且不得形成组织循环，parentId 为 null 表示改为顶层节点。
      x-ui-operations: [D03]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentUpdate' }
            example: { name: 档案管理室 }
      responses:
        '200':
          description: 部门已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Department' }
              example: { id: 5, name: 档案管理室, parentId: 2 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /users:
    get:
      operationId: listUsers
      tags: [用户与部门, 用户授权]
      summary: 按管理范围查看或搜索用户
      description: |
        总管理员可查询组织树中的全部用户，部门管理员可查询本部门及下级部门的用户。
        用户与部门页和用户授权页共用此列表。指定 departmentId 时，查询该部门及下级部门中的用户。
      x-ui-operations: [D04, G01]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          description: 按姓名、用户名搜索，用户授权页可一并按所属部门名称搜索
          schema: { $ref: '#/components/schemas/Keyword' }
        - name: includeDepartmentName
          in: query
          description: 为 true 时，keyword 也匹配所属部门名称
          schema: { type: boolean, default: false }
        - name: departmentId
          in: query
          description: 所选部门 ID，必须位于调用者的管理范围
          schema: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: 管理范围内的用户分页结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
              example:
                items:
                  - id: 12
                    username: lin.xiao
                    name: 林晓
                    department: { id: 3, name: 综合办公室 }
                    status: ACTIVE
                    departmentAdministrator: false
                    businessRoles: [{ id: 2, name: 普通员工 }]
                page: 1
                pageSize: 20
                total: 1
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createUser
      tags: [用户与部门]
      summary: 新增用户
      description: |
        管理员在其管理范围内新增用户。用户名全局唯一，默认账号状态为 ACTIVE。
        总管理员可在创建时一并指定部门管理员。仅总管理员可以提交 departmentAdministrator。
        系统生成初始密码，仅在本次创建响应中返回，供管理员安全交付给用户。
      x-ui-operations: [D05, D08]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
            example: { username: zhou.min, name: 周敏, departmentId: 3 }
      responses:
        '201':
          description: 用户已创建
          headers:
            Cache-Control:
              description: 初始密码响应禁止缓存
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserCreated' }
              example:
                user:
                  id: 24
                  username: zhou.min
                  name: 周敏
                  department: { id: 3, name: 综合办公室 }
                  status: ACTIVE
                  departmentAdministrator: false
                  businessRoles: []
                initialPassword: Example-Initial-Password-24
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getUser
      tags: [用户与部门, 用户授权]
      summary: 查看用户信息及已有角色
      description: 管理员可查询管理范围内的用户信息。编辑用户和分配角色弹窗共用该结果。
      x-ui-operations: [D06, D07, D08, G02]
      responses:
        '200': { $ref: '#/components/responses/UserReturned' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: updateUser
      tags: [用户与部门]
      summary: 修改用户、账号状态或所属部门
      description: |
        管理员可修改管理范围内用户的姓名、用户名和账号状态。
        仅总管理员可提交 departmentId 办理跨部门调动，或提交 departmentAdministrator 任命、撤销部门管理员角色。
        调动后保留用户已有的业务角色。新部门决定后续管理范围。
        账号停用后撤销其会话，后续登录和受保护的权限检查均不通过。重要操作写入操作记录。
      x-ui-operations: [D06, D07, D08]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
            examples:
              transfer:
                summary: 调动至财务部
                value: { departmentId: 4 }
              disable:
                summary: 停用账号
                value: { status: DISABLED }
              appoint:
                summary: 指定部门管理员
                value: { departmentAdministrator: true }
      responses:
        '200': { $ref: '#/components/responses/UserTransferred' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /users/{userId}/roles:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: replaceUserBusinessRoles
      tags: [用户授权]
      summary: 保存单个用户的业务角色
      description: |
        管理员提交管理范围内该用户最终应拥有的业务角色 ID 列表。空列表表示撤销全部业务角色。
        管理角色不在本接口的修改范围。保存成功后直接生效，记录发生的分配和撤销。
      x-ui-operations: [G03]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceUserRoles' }
            example: { roleIds: [2, 8] }
      responses:
        '200':
          description: 已保存的业务角色
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserRoleResult' }
              example: { userId: 12, roleIds: [2, 8] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /user-role-assignments:
    patch:
      operationId: changeUserRolesInBatch
      tags: [用户授权]
      summary: 批量分配或撤销业务角色
      description: |
        管理员提交所选用户、所选业务角色，以及分配或撤销动作。所有用户都必须位于管理范围。
        先校验整批，成功后一起保存并立即生效。用户的其他角色保留。
        同一角色已分配时重复分配、未分配时重复撤销，均保持该用户现状。
      x-ui-operations: [G04, G05]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchRoleChange' }
            examples:
              grant:
                summary: 批量分配
                value: { action: GRANT, userIds: [12, 13], roleIds: [8] }
              revoke:
                summary: 批量撤销
                value: { action: REVOKE, userIds: [12, 13], roleIds: [8] }
      responses:
        '200':
          description: 批量操作已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchRoleResult' }
              example: { action: GRANT, affectedUsers: 2 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /me/permissions:
    get:
      operationId: getMyPermissions
      tags: [我的权限]
      summary: 查看我的权限
      description: |
        查询当前登录用户的业务角色，以及按应用归类的可见菜单和可用按钮。
        同一权限经多个角色授予时只返回一次。尚未获得权限的应用返回空菜单列表。
      x-ui-operations: [M01]
      responses:
        '200':
          description: 当前用户的有效业务权限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyPermissions' }
              example:
                businessRoles: [{ id: 2, name: 普通员工 }, { id: 8, name: 公文审批员 }]
                applications:
                  - applicationId: 1
                    applicationName: OA 协同办公
                    menus:
                      - id: 101
                        name: 公文管理
                        code: 'document:view'
                        buttons: [{ id: 102, name: 审批公文, code: 'document:approve' }]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /operation-logs:
    get:
      operationId: listOperationLogs
      tags: [操作记录]
      summary: 查看或搜索操作记录
      description: |
        总管理员查看全部记录。部门管理员查看本部门及下级部门用户的管理记录，
        以操作发生时用户所属的部门判断。同一批次涉及多部门时，只返回管理范围内的对象，
        搜索和分页同样基于筛选后的记录和对象。
        应用登记、角色权限配置、部门结构维护、跨部门调动等全局记录仅总管理员可见。
      x-ui-operations: [O01]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          description: 搜索操作人、可见对象或操作内容
          schema: { $ref: '#/components/schemas/Keyword' }
      responses:
        '200':
          description: 可查看的操作记录分页结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationLogPage' }
              example:
                items:
                  - id: 130
                    occurredAt: '2026-11-10T09:15:00+08:00'
                    actorName: 顾晨
                    action: 批量分配角色
                    targetNames: [林晓, 何雨桐]
                    detail: 公文审批员
                    result: SUCCESS
                page: 1
                pageSize: 20
                total: 1
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /applications/{applicationId}/permission-checks:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    post:
      operationId: checkBusinessPermission
      tags: [业务系统接入]
      summary: 检查指定应用中的用户权限
      description: |
        业务系统用接入时配置的应用令牌调用。令牌绑定应用，路径中的应用 ID 必须与令牌对应。
        业务系统先确认当前业务用户身份，再提交对应的权限中心用户 ID 和权限标识。
        权限中心根据当前有效业务角色检查用户在该应用中是否拥有这项权限。
        用户停用、用户或权限不存在、未获授权时，返回 allowed 为 false。业务系统据此拒绝操作。
      x-requirement: 核心需求 7 权限检查
      security:
        - ApplicationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionCheck' }
            example: { userId: 12, permissionCode: 'document:approve' }
      responses:
        '200':
          description: 本次权限检查结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionCheckResult' }
              examples:
                granted:
                  value: { allowed: true }
                denied:
                  value: { allowed: false }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    SessionToken:
      type: http
      scheme: bearer
      description: |
        登录返回的会话令牌。通过 Authorization 请求头传递 Bearer 令牌。
        服务端在受保护接口验证会话、账号状态和当前管理权限。退出、过期或账号停用后会话无效。
    ApplicationToken:
      type: apiKey
      in: header
      name: X-Application-Token
      description: 接入时为单个应用配置的服务端令牌。仅用于该应用的权限检查，由业务系统后端保管。
  parameters:
    ApplicationId:
      name: applicationId
      in: path
      required: true
      description: 应用 ID
      schema: { $ref: '#/components/schemas/Id' }
      example: 1
    PermissionId:
      name: permissionId
      in: path
      required: true
      description: 权限 ID
      schema: { $ref: '#/components/schemas/Id' }
      example: 102
    RoleId:
      name: roleId
      in: path
      required: true
      description: 业务角色 ID
      schema: { $ref: '#/components/schemas/Id' }
      example: 8
    DepartmentId:
      name: departmentId
      in: path
      required: true
      description: 部门 ID
      schema: { $ref: '#/components/schemas/Id' }
      example: 3
    UserId:
      name: userId
      in: path
      required: true
      description: 用户 ID
      schema: { $ref: '#/components/schemas/Id' }
      example: 12
    Page:
      name: page
      in: query
      description: 页码，从 1 开始
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      description: 每页条数
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    RoleCreated:
      description: 角色及其权限已保存
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RoleDetails' }
          example:
            id: 8
            name: 公文审批员
            description: 处理 OA 公文审批
            applications: [{ applicationId: 1, applicationName: OA 协同办公, permissionCount: 2 }]
            permissionIds: [101, 102]
    RoleReturned:
      description: 角色信息及完整权限配置
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RoleDetails' }
          example:
            id: 8
            name: 公文审批员
            description: 审批公文并查看员工档案
            applications:
              - { applicationId: 1, applicationName: OA 协同办公, permissionCount: 2 }
              - { applicationId: 2, applicationName: 人事系统, permissionCount: 1 }
            permissionIds: [101, 102, 201]
    UserReturned:
      description: 用户信息及其已有的业务角色
      content:
        application/json:
          schema: { $ref: '#/components/schemas/User' }
          example:
            id: 12
            username: lin.xiao
            name: 林晓
            department: { id: 3, name: 综合办公室 }
            status: ACTIVE
            departmentAdministrator: false
            businessRoles: [{ id: 2, name: 普通员工 }]
    UserTransferred:
      description: 保存后的用户信息
      content:
        application/json:
          schema: { $ref: '#/components/schemas/User' }
          examples:
            transfer:
              summary: 调动后保留原角色
              value:
                id: 12
                username: lin.xiao
                name: 林晓
                department: { id: 4, name: 财务部 }
                status: ACTIVE
                departmentAdministrator: false
                businessRoles: [{ id: 2, name: 普通员工 }]
            disable:
              summary: 停用后的账号状态
              value:
                id: 12
                username: lin.xiao
                name: 林晓
                department: { id: 3, name: 综合办公室 }
                status: DISABLED
                departmentAdministrator: false
                businessRoles: [{ id: 2, name: 普通员工 }]
            appoint:
              summary: 指定部门管理员后的身份
              value:
                id: 12
                username: lin.xiao
                name: 林晓
                department: { id: 3, name: 综合办公室 }
                status: ACTIVE
                departmentAdministrator: true
                businessRoles: [{ id: 2, name: 普通员工 }]
    BadRequest:
      description: 请求格式、字段或关联不符合要求
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:rbac-admin:problem:invalid-request
            title: 请求不符合要求
            status: 400
            code: INVALID_REQUEST
            detail: 请检查请求参数及必填字段。
    Unauthorized:
      description: 登录凭据无效，或访问凭据缺失、过期或已撤销
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:rbac-admin:problem:unauthenticated
            title: 身份校验失败
            status: 401
            code: UNAUTHENTICATED
            detail: 请检查登录信息或访问凭据。
    Forbidden:
      description: 角色或账号状态不允许操作，目标超出管理范围，或应用令牌与应用不匹配
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            outsideScope:
              value:
                type: urn:rbac-admin:problem:outside-management-scope
                title: 超出管理范围
                status: 403
                code: OUTSIDE_MANAGEMENT_SCOPE
                detail: 请选择本部门或下级部门内的对象。
            disabled:
              value:
                type: urn:rbac-admin:problem:account-disabled
                title: 账号已停用
                status: 403
                code: ACCOUNT_DISABLED
                detail: 请联系管理员确认账号状态。
            forbidden:
              value:
                type: urn:rbac-admin:problem:forbidden
                title: 操作不被允许
                status: 403
                code: FORBIDDEN
                detail: 当前角色无权执行该操作。
            applicationMismatch:
              value:
                type: urn:rbac-admin:problem:application-mismatch
                title: 应用不匹配
                status: 403
                code: APPLICATION_MISMATCH
                detail: 应用 ID 必须与应用令牌对应。
    NotFound:
      description: 目标资源或必需的关联资源不存在
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:rbac-admin:problem:not-found
            title: 对象不存在
            status: 404
            code: NOT_FOUND
            detail: 请检查目标 ID 后重试。
    Conflict:
      description: 名称、用户名或应用内权限标识与已有数据重复，或待删除角色仍关联用户
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:rbac-admin:problem:conflict
            title: 数据已存在
            status: 409
            code: CONFLICT
            detail: 同一应用内已存在相同的权限标识，请检查后重试。
    TooManyRequests:
      description: 登录尝试过于频繁
      headers:
        Retry-After:
          description: 可再次尝试前的等待秒数
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:rbac-admin:problem:too-many-requests
            title: 登录尝试过于频繁
            status: 429
            code: TOO_MANY_REQUESTS
            detail: 请稍后再试。
    InternalError:
      description: 系统暂时无法完成操作
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:rbac-admin:problem:internal-error
            title: 系统暂时不可用
            status: 500
            code: INTERNAL_ERROR
            detail: 请稍后重试。
  schemas:
    Id:
      type: integer
      format: int64
      minimum: 1
      maximum: 9007199254740991
      description: 数字 ID，取值范围可由浏览器安全表示。
    NullableId:
      oneOf:
        - $ref: '#/components/schemas/Id'
        - type: 'null'
    IdList:
      type: array
      uniqueItems: true
      items: { $ref: '#/components/schemas/Id' }
    RequiredIdList:
      allOf:
        - $ref: '#/components/schemas/IdList'
        - minItems: 1
    Name:
      type: string
      minLength: 1
      maxLength: 24
    Username:
      type: string
      minLength: 1
      maxLength: 32
    Keyword:
      type: string
      maxLength: 100
    Description:
      type: string
      maxLength: 48
      default: ''
    PermissionCode:
      type: string
      maxLength: 64
      pattern: '^[^:\s]+:[^:\s]+$'
      example: 'ticket:close'
    ManagementRole:
      type: string
      enum: [TOTAL_ADMIN, DEPARTMENT_ADMIN, NONE]
    AccountStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    PermissionType:
      type: string
      enum: [MENU, BUTTON]
    BatchAction:
      type: string
      enum: [GRANT, REVOKE]
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { $ref: '#/components/schemas/Username' }
        password: { type: string, minLength: 1, format: password }
    LoginResult:
      type: object
      required: [accessToken, expiresAt, user]
      properties:
        accessToken: { type: string, minLength: 1 }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/SessionUser' }
    SessionUser:
      type: object
      required: [id, username, name, departmentId, managementRole]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        username: { $ref: '#/components/schemas/Username' }
        name: { $ref: '#/components/schemas/Name' }
        departmentId: { $ref: '#/components/schemas/NullableId' }
        managementRole: { $ref: '#/components/schemas/ManagementRole' }
    Application:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { $ref: '#/components/schemas/Name' }
    ApplicationInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { $ref: '#/components/schemas/Name' }
    ApplicationPermissions:
      type: object
      required: [applicationId, applicationName, menus]
      properties:
        applicationId: { $ref: '#/components/schemas/Id' }
        applicationName: { $ref: '#/components/schemas/Name' }
        menus:
          type: array
          items: { $ref: '#/components/schemas/MenuNode' }
    MenuNode:
      type: object
      required: [id, name, code, buttons]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { $ref: '#/components/schemas/Name' }
        code: { $ref: '#/components/schemas/PermissionCode' }
        buttons:
          type: array
          items: { $ref: '#/components/schemas/PermissionRef' }
    PermissionRef:
      type: object
      required: [id, name, code]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { $ref: '#/components/schemas/Name' }
        code: { $ref: '#/components/schemas/PermissionCode' }
    Permission:
      allOf:
        - $ref: '#/components/schemas/PermissionRef'
        - type: object
          required: [applicationId, type, parentId]
          properties:
            applicationId: { $ref: '#/components/schemas/Id' }
            type: { $ref: '#/components/schemas/PermissionType' }
            parentId: { $ref: '#/components/schemas/NullableId' }
    PermissionCreate:
      oneOf:
        - title: 新增菜单权限
          type: object
          additionalProperties: false
          required: [name, code, type]
          properties:
            name: { $ref: '#/components/schemas/Name' }
            code: { $ref: '#/components/schemas/PermissionCode' }
            type: { type: string, const: MENU }
            parentId: { type: 'null' }
        - title: 新增按钮权限
          type: object
          additionalProperties: false
          required: [name, code, type, parentId]
          properties:
            name: { $ref: '#/components/schemas/Name' }
            code: { $ref: '#/components/schemas/PermissionCode' }
            type: { type: string, const: BUTTON }
            parentId: { $ref: '#/components/schemas/Id' }
    PermissionUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { $ref: '#/components/schemas/Name' }
        code: { $ref: '#/components/schemas/PermissionCode' }
    RoleRef:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { $ref: '#/components/schemas/Name' }
    RoleApplicationSummary:
      type: object
      required: [applicationId, applicationName, permissionCount]
      properties:
        applicationId: { $ref: '#/components/schemas/Id' }
        applicationName: { $ref: '#/components/schemas/Name' }
        permissionCount: { type: integer, minimum: 1 }
    RoleSummary:
      allOf:
        - $ref: '#/components/schemas/RoleRef'
        - type: object
          required: [description, applications]
          properties:
            description: { $ref: '#/components/schemas/Description' }
            applications:
              type: array
              description: 该角色已获授权的应用及权限数量
              items: { $ref: '#/components/schemas/RoleApplicationSummary' }
    RoleDetails:
      allOf:
        - $ref: '#/components/schemas/RoleSummary'
        - type: object
          required: [permissionIds]
          properties:
            permissionIds: { $ref: '#/components/schemas/IdList' }
    RoleInput:
      type: object
      additionalProperties: false
      required: [name, permissionIds]
      properties:
        name: { $ref: '#/components/schemas/Name' }
        description: { $ref: '#/components/schemas/Description' }
        permissionIds: { $ref: '#/components/schemas/IdList' }
    DepartmentRef:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { $ref: '#/components/schemas/Name' }
    Department:
      allOf:
        - $ref: '#/components/schemas/DepartmentRef'
        - type: object
          required: [parentId]
          properties:
            parentId: { $ref: '#/components/schemas/NullableId' }
    DepartmentNode:
      allOf:
        - $ref: '#/components/schemas/Department'
        - type: object
          required: [children]
          properties:
            children:
              type: array
              items: { $ref: '#/components/schemas/DepartmentNode' }
    DepartmentTree:
      type: object
      required: [departments]
      properties:
        departments:
          type: array
          items: { $ref: '#/components/schemas/DepartmentNode' }
    DepartmentInput:
      type: object
      additionalProperties: false
      required: [name, parentId]
      properties:
        name: { $ref: '#/components/schemas/Name' }
        parentId: { $ref: '#/components/schemas/NullableId' }
    DepartmentUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { $ref: '#/components/schemas/Name' }
        parentId: { $ref: '#/components/schemas/NullableId' }
    User:
      type: object
      required: [id, username, name, department, status, departmentAdministrator, businessRoles]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        username: { $ref: '#/components/schemas/Username' }
        name: { $ref: '#/components/schemas/Name' }
        department: { $ref: '#/components/schemas/DepartmentRef' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        departmentAdministrator: { type: boolean }
        businessRoles:
          type: array
          items: { $ref: '#/components/schemas/RoleRef' }
    UserCreate:
      type: object
      additionalProperties: false
      required: [username, name, departmentId]
      properties:
        username: { $ref: '#/components/schemas/Username' }
        name: { $ref: '#/components/schemas/Name' }
        departmentId: { $ref: '#/components/schemas/Id' }
        status:
          $ref: '#/components/schemas/AccountStatus'
          default: ACTIVE
        departmentAdministrator:
          type: boolean
          description: 仅总管理员可提交，省略时创建为普通用户。
    UserCreated:
      type: object
      required: [user, initialPassword]
      properties:
        user: { $ref: '#/components/schemas/User' }
        initialPassword:
          type: string
          minLength: 1
          description: 系统生成，仅创建成功时返回。查询和操作记录中不返回。
    UserUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        username: { $ref: '#/components/schemas/Username' }
        name: { $ref: '#/components/schemas/Name' }
        departmentId:
          $ref: '#/components/schemas/Id'
          description: 仅总管理员可提交。
        status: { $ref: '#/components/schemas/AccountStatus' }
        departmentAdministrator:
          type: boolean
          description: 仅总管理员可提交，true 分配部门管理员角色，false 撤销该角色。
    ReplaceUserRoles:
      type: object
      additionalProperties: false
      required: [roleIds]
      properties:
        roleIds: { $ref: '#/components/schemas/IdList' }
    UserRoleResult:
      type: object
      required: [userId, roleIds]
      properties:
        userId: { $ref: '#/components/schemas/Id' }
        roleIds: { $ref: '#/components/schemas/IdList' }
    BatchRoleChange:
      type: object
      additionalProperties: false
      required: [action, userIds, roleIds]
      properties:
        action: { $ref: '#/components/schemas/BatchAction' }
        userIds: { $ref: '#/components/schemas/RequiredIdList' }
        roleIds: { $ref: '#/components/schemas/RequiredIdList' }
    BatchRoleResult:
      type: object
      required: [action, affectedUsers]
      properties:
        action: { $ref: '#/components/schemas/BatchAction' }
        affectedUsers:
          type: integer
          minimum: 0
          description: 业务角色实际发生变化的用户数。
    MyPermissions:
      type: object
      required: [businessRoles, applications]
      properties:
        businessRoles:
          type: array
          items: { $ref: '#/components/schemas/RoleRef' }
        applications:
          type: array
          items: { $ref: '#/components/schemas/ApplicationPermissions' }
    OperationLog:
      type: object
      required: [id, occurredAt, actorName, action, targetNames, detail, result]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        occurredAt: { type: string, format: date-time }
        actorName: { type: string }
        action: { type: string }
        targetNames:
          type: array
          items: { type: string }
        detail: { type: string }
        result: { type: string, enum: [SUCCESS, FAILURE] }
    PermissionCheck:
      type: object
      additionalProperties: false
      required: [userId, permissionCode]
      properties:
        userId: { $ref: '#/components/schemas/Id' }
        permissionCode: { $ref: '#/components/schemas/PermissionCode' }
    PermissionCheckResult:
      type: object
      required: [allowed]
      properties:
        allowed: { type: boolean }
    PageMetadata:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    ApplicationPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Application' }
    RolePage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/RoleSummary' }
    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/User' }
    OperationLogPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/OperationLog' }
    Problem:
      type: object
      required: [type, title, status, code, detail]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - UNAUTHENTICATED
            - FORBIDDEN
            - ACCOUNT_DISABLED
            - OUTSIDE_MANAGEMENT_SCOPE
            - APPLICATION_MISMATCH
            - NOT_FOUND
            - CONFLICT
            - TOO_MANY_REQUESTS
            - INTERNAL_ERROR
        detail: { type: string }
