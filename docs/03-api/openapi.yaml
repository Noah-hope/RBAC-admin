                id: 41
                applicantUserId: 2
                applicantName: 顾晨
                name: 课程审核员
                description: 审核课程申请
                permissionIds:
                  - 101
                  - 102
                status: PENDING
                reviewerUserId: null
                createdRoleId: null
                createdAt: 2026-11-15T09:00:00+08:00
                reviewedAt: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/v1/role-creation-requests/{requestId}":
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: getRoleCreationRequest
      tags:
        - 角色创建申请
      summary: 查看角色创建申请配置
      description: 提交者或总管理员可查看，其他人及不存在返回 404。总管理员点击受理时只调用此读取接口并打开角色编辑表单；不修改状态。取消编辑无需提交
        API，申请保持 PENDING。
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleCreationRequest"
              example:
                id: 41
                applicantUserId: 2
                applicantName: 顾晨
                name: 课程审核员
                description: 审核课程申请
                permissionIds:
                  - 101
                  - 102
                status: PENDING
                reviewerUserId: null
                createdRoleId: null
                createdAt: 2026-11-15T09:00:00+08:00
                reviewedAt: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
