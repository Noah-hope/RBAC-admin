openapi: 3.1.0
info:
  title: RBAC 权限中心 API
  version: 2.1.0
  description: >-
    新版设计契约，依据已确认需求、界面操作清单和课程系统的统一身份接口。RBAC0 后端已按本版实现，实际 MySQL 迁移与外部系统联调待验证。


    本系统及所有接入应用使用统一账号、登录、退出和权限检查。统一身份接口使用 /auth 路径，权限中心管理接口保留 /api/v1 路径。成功响应直接返回业务数据，错误使用 application/problem+json。


    登录返回 RS256 签名 JWT。sub 为用户数字 ID 的字符串，aud 为本次登录的应用 code 列表；还包含 iss、iat、exp、jti。JWT 不包含角色和权限。业务系统用公钥验签，受保护操作仍须向权限中心检查令牌、账号状态和权限。退出撤销当前令牌，使用它的所有接入系统均不可继续操作。


    /auth/me 及两个单项权限检查接口按当前应用返回结果。aud 只有一个应用时自动选定；aud 有多个应用时，通过 X-Application-Code 指定本次应用，该值必须属于 aud。权限中心管理接口固定属于 permission-center，aud 必须包含它。


    本系统管理菜单、按钮和 API 同样登记在 permission-center 应用下。管理接口检查已登记的权限关联，同时保留总管理员、部门管理员的职责和部门范围。统一身份和公钥接口不依赖业务菜单权限。


    角色按菜单和按钮权限授权，不直接勾选 API。API 通过关联权限判断。operationId 与前端权限码是不同标识；本版用已确认的 API 关联关系衔接后端功能权限，课程组长、任课教师等对象范围由业务系统判断。


    旧契约迁移：POST /api/v1/sessions 改为 POST /auth/login；DELETE /api/v1/sessions/current 改为 POST /auth/logout；GET /api/v1/me 改为 GET /auth/me。原 /api/v1/applications/{applicationId}/permission-checks 由当前令牌下的两个 /auth 检查接口替代，调用方不再指定 userId。旧随机会话令牌和 X-Application-Token 不用于新版接入，切换后重新登录。


    列表保留 page、pageSize，部门树和权限树完整返回。权限、API 关联和成功记录一起保存，失败则整次回滚；下一次检查反映成功的变更。x-ui-operations 对应界面操作编号。


    2.1 设计修订：权限与 API 为多对多；API 独立登记，解除权限关联不会删除 API。补齐权限申请、角色创建申请及审核。接口实现位于 rbac0-structured，内存数据库与 HTTP 测试不代替真实接入验证。

    权限中心的新增、编辑部门仅总管理员使用，部门管理员页面不显示这两个按钮；直接调用仍返回 403。权限授予不能绕过固定管理员职责。我的权限、我的申请和提交本人申请属于登录后的基础能力。

    权限目录和角色配置变化后，也须同步处理因此已满足的 PENDING 申请；已结束的历史申请不恢复。身份令牌不保存权限快照，权限检查读取当前有效授权。
servers:
  - url: /
    description: 系统部署域名；身份接口 /auth，管理接口 /api/v1
security:
  - BearerAuth: []
tags:
  - name: 统一身份鉴权
    description: 所有接入系统共用的登录、退出和当前用户权限检查。
  - name: 签名公钥
    description: 业务系统验证 JWT 的公开密钥。
  - name: 应用与权限
    description: 登记应用、菜单按钮及其关联 API。
  - name: 角色管理
    description: 配置业务角色并删除未关联用户的角色。
  - name: 用户与部门
    description: 维护用户、所属部门和组织结构。
  - name: 用户授权
    description: 单人和批量分配、撤销角色。
  - name: 我的权限
    description: 权限中心按应用汇总当前用户权限。
  - name: 操作记录
    description: 按管理范围查看重要操作。
  - name: API 登记
    description: 总管理员维护独立的 API 清单和权限关联。
  - name: 权限申请
    description: 本人申请与撤回，管理员按范围审核。
  - name: 角色创建申请
    description: 部门管理员提出配置，总管理员保存角色后完成审批。
paths:
  /auth/login:
    post:
      operationId: login
      tags:
        - 统一身份鉴权
      summary: 统一登录
      description: 使用统一用户名和密码登录。systems 填目标应用 code：课程系统为
        course-project-management，本系统为 permission-center。所有 code 必须已登记，返回 JWT 的
        aud 与此列表一致。aud 表示目标应用，不代表自动拥有该应用权限。凭据错误或账号停用均返回 401。
      x-ui-operations:
        - L01
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              username: "20220101"
              password: DemoPassword2026
              systems:
                - course-project-management
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
              example:
                accessToken: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6InJiYWMtZXhhbXBsZSJ9.eyJpc3MiOiJodHRwczovL2lkZW50aXR5LmV4YW1wbGUuZWR1Iiwic3ViIjoiMTIiLCJhdWQiOlsiY291cnNlLXByb2plY3QtbWFuYWdlbWVudCJdLCJpYXQiOjE3OTQ0MTI4MDAsImV4cCI6MTc5NDQyMDAwMCwianRpIjoiZXhhbXBsZS1sb2dpbi0xMiJ9.mQzs-2wRjx0sc4SREwTe4T2Ed7Ai3sz69naXUEGmatXdkAh1NX4TNOvRXjzQYvCoR1knJEfi7Ryv8tXZ8Z_FDZW8JJ5Uda7rSENcs8Z_tySIc1LlSvBvg9dHbVmIvtgC1IZLyCMeAOYKBvevDIlBqVTi8WORm2vC84oAjY8NyRfYG9nerWe5DEJcYholoOjazBM9Id__jJY5WA3UVKWoRbbmKqHX0igeZ8aNQVavTjXkH1xJJDwKcdvCKqa8vYnszPFb-n86xVA67GouJISM3tvQwKFk2vIIwCWQR_jfcgcLQ2cQANclu6GQQAu9GQe1Pl8-3Mjf0ltS764oU-4a2A
                tokenType: Bearer
                expiresIn: 7200
          headers:
            Cache-Control:
              description: 不缓存当前身份或授权结果
              schema:
                type: string
                const: no-store
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      externalDocs:
        description: 课程管理系统统一身份鉴权契约
        url: https://s.apifox.cn/775094d6-9f5f-4b75-9600-2332c43948d3/api-523792399e0
      x-implementation-status: 已实现，待外部联调
  /auth/logout:
    post:
      operationId: logout
      tags:
        - 统一身份鉴权
      summary: 统一退出登录
      description: 使用当前 Bearer 令牌退出，不提交用户 ID。中心使当前令牌失效，所有使用它的接入系统后续检查均返回 401。
      x-ui-operations:
        - L02
      responses:
        "204":
          description: 当前令牌已失效，无响应正文
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      externalDocs:
        description: 课程管理系统统一身份鉴权契约
        url: https://s.apifox.cn/775094d6-9f5f-4b75-9600-2332c43948d3/api-523792400e0
      x-implementation-status: 已实现，待外部联调
  /auth/me:
    get:
      operationId: getCurrentUserAndPermissions
      tags:
        - 统一身份鉴权
      summary: 当前用户、角色与权限
      description: 从令牌识别当前用户与目标应用，返回该应用的角色和前端菜单、按钮权限。roles 用已有角色数字 ID
        的字符串表示，不新增角色标识字段；subject 为用户 ID 字符串，no
        为统一账号用户名。id、departmentId、managementRole
        是供权限中心页面使用的补充字段。权限结果用于页面显示，业务后端仍须检查。
      x-ui-operations:
        - L03
      parameters:
        - $ref: "#/components/parameters/ApplicationContext"
      responses:
        "200":
          description: 当前用户在目标应用中的身份、角色和权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
              example:
                subject: "12"
                roles:
                  - "3"
                permissions:
                  - course:viewOwn
                  - course:create
                name: 林晓
                no: "20220101"
                id: 12
                departmentId: 3
                managementRole: NONE
          headers:
            Cache-Control:
              description: 不缓存当前身份或授权结果
              schema:
                type: string
                const: no-store
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      externalDocs:
        description: 课程管理系统统一身份鉴权契约
        url: https://s.apifox.cn/775094d6-9f5f-4b75-9600-2332c43948d3/api-523792401e0
      x-implementation-status: 已实现，待外部联调
  "/auth/permissions/{permission}":
    get:
      operationId: checkCurrentFrontendPermission
      tags:
        - 统一身份鉴权
      summary: 校验当前用户是否具备指定前端权限
      description: 检查当前用户在目标应用中的一项菜单或按钮权限，只返回 allowed。不接受 userId。权限未登记或未获授权返回
        200、allowed=false；令牌无效或账号停用返回 401。
      x-requirement: 核心需求 7 权限检查
      parameters:
        - $ref: "#/components/parameters/FrontendPermission"
        - $ref: "#/components/parameters/ApplicationContext"
      responses:
        "200":
          description: 单项前端权限检查结果
          headers:
            Cache-Control:
              description: 不缓存当前身份或授权结果
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionCheckResult"
              examples:
                allowed:
                  value:
                    allowed: true
                denied:
                  value:
                    allowed: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      externalDocs:
        description: 课程管理系统统一身份鉴权契约
        url: https://s.apifox.cn/775094d6-9f5f-4b75-9600-2332c43948d3/api-534170404e0
      x-implementation-status: 已实现，待外部联调
  "/auth/api-permissions/{operationId}":
    get:
      operationId: checkCurrentApiPermission
      tags:
        - 统一身份鉴权
      summary: 判断当前用户能否调用指定 API 接口
      description: 业务后端转交当前用户的 Bearer 令牌，并从实际请求确定 operationId，不信任前端自行声明的目标接口。按目标应用查找
        API，读取其全部关联权限；当前有效角色拥有其中任意一项即 allowed=true（OR），没有关联权限则 allowed=false。API
        未登记返回 404；未获授权返回 200、allowed=false；无效令牌、退出或停用账号返回 401；检查不可用返回
        503，均不得执行操作。只检查功能权限，固定管理员职责、部门范围及业务对象范围仍由目标后端落实。
      x-requirement: 核心需求 7 权限检查
      parameters:
        - $ref: "#/components/parameters/OperationId"
        - $ref: "#/components/parameters/ApplicationContext"
      responses:
        "200":
          description: 当前用户调用目标 API 的权限
          headers:
            Cache-Control:
              description: 不缓存当前身份或授权结果
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiCheckResult"
              examples:
                allowed:
                  value:
                    operationId: listAdminCourses
                    allowed: true
                denied:
                  value:
                    operationId: listAdminCourses
                    allowed: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      externalDocs:
        description: 课程管理系统统一身份鉴权契约
        url: https://s.apifox.cn/775094d6-9f5f-4b75-9600-2332c43948d3/api-534180421e0
      x-implementation-status: 已实现，待外部联调
  /.well-known/jwks.json:
    get:
      operationId: getSigningPublicKeys
      tags:
        - 签名公钥
      summary: 获取 JWT 验签公钥
      description: 公开 RSA 公钥。业务系统根据 JWT 头部 kid
        选择公钥，并检查签名、签发者、时效及目标应用。只提供公钥，不返回私钥。验签不替代权限与退出失效检查。
      security: []
      responses:
        "200":
          description: JWT 签名公钥集合
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwkSet"
              example:
                keys:
                  - kty: RSA
                    use: sig
                    alg: RS256
                    kid: rbac-example
                    n: qsAzov1IxNIaSBr_V5bHmXgeDdNEWkHPpLqOLyfXEvnwWiNj-i4aeNthJ0ErtdzjdLQJc21R9yfZehCXJDTByodFW3tMM6771nvUHT-4qduupHL2ixRE9AMZ9ICEOS0Ma4WHlI4GKJAKfFpeByHnAWVAF39SVfJkmbCAjs9hLZ5Ox-H7LZFzklr5hDrov2fLpGPcDuNIgLafbBWIXQ6CmohZWqb3UqV2p9oxmzaRnQKCXFQu_Cs8-TjWoDRlvLVQkS3CWoJbqzFF8d5SJ4ppNRU3aeGPl0mLpHrdeUsy5ju0xbWLlw7BAJFLWyuqOwZMwqURjUFNU8JAifXgTlcSKQ
                    e: AQAB
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/applications:
    get:
      operationId: listApplications
      tags: [ 应用与权限 ]
      summary: 查询应用列表
      description: 总管理员查询应用。本系统 code 为 permission-center，课程系统为
        course-project-management。数字 id 用于管理接口，code 用于统一登录 systems 和 JWT aud。
      x-ui-operations: [ A01, R02, R03 ]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        "200":
          description: 已登记应用分页结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationPage"
              example:
                items:
                  - id: 1
                    name: 权限管理系统
                    code: permission-center
                  - id: 2
                    name: 课程管理系统
                    code: course-project-management
                page: 1
                pageSize: 20
                total: 2
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createApplication
      tags: [ 应用与权限 ]
      summary: 新增应用
      description: 总管理员登记应用。name 必填；code 可填业务系统约定标识，省略时系统生成 app-{id}。code
        全局唯一，创建后固定，不随显示名称变化。
      x-ui-operations: [ A02 ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationCreate"
            example:
              name: 图书管理系统
              code: library-management
      responses:
        "201":
          description: 应用已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
              example:
                id: 3
                name: 图书管理系统
                code: library-management
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/v1/applications/{applicationId}":
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    patch:
      operationId: updateApplication
      tags: [ 应用与权限 ]
      summary: 修改应用名称
      description: 总管理员修改显示名称，应用数字 ID 和对接 code 保持固定。
      x-ui-operations: [ A03 ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
            example:
              name: 课程项目管理系统
      responses:
        "200":
          description: 应用名称已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
              example:
                id: 2
                name: 课程项目管理系统
                code: course-project-management
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/v1/applications/{applicationId}/permissions":
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      operationId: getApplicationPermissionTree
      tags: [ 应用与权限 ]
      summary: 查看应用权限树
      description: 总管理员查看应用的菜单和按钮，每项的 apiCount 表示关联接口数量。编辑时通过权限详情接口读取完整
        API。应用目录与角色配置共用此树，角色仍按权限 ID 勾选。
      x-ui-operations: [ A04, R02, R03 ]
      responses:
        '200':
          description: 应用内的完整权限树
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationPermissions' }
              example:
                applicationId: 2
                applicationName: 课程管理系统
                applicationCode: course-project-management
                menus:
                  - id: 101
                    name: 所有课程
                    code: course:viewAll
                    apiCount: 1
                    buttons:
                      - id: 102
                        name: 审核课程
                        code: course:review
                        apiCount: 1
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createPermission
      tags: [ 应用与权限 ]
      summary: 登记菜单或按钮权限
      description: 仅总管理员。登记应用内唯一的资源:操作权限标识。菜单 parentId 省略或为 null；按钮必须指向同应用菜单。apiIds
        为已登记 API 的完整关联 ID 列表，可为空；不存在或属于其他应用则 400。同一 API
        可关联多项权限。权限、关联和成功记录在同一事务保存。需要新增 API 时先调用 API 登记接口，再将返回的 ID 提交本接口。
      x-ui-operations:
        - A05
        - A08
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionCreate"
            examples:
              menu:
                value:
                  name: 所有课程
                  code: course:viewAll
                  type: MENU
                  apiIds:
                    - 1000
              button:
                value:
                  name: 审核课程
                  code: course:review
                  type: BUTTON
                  parentId: 101
                  apiIds:
                    - 1001
      responses:
        "201":
          description: 权限及 API 关联已保存，API 登记由独立接口维护
          content:
            application/json:
