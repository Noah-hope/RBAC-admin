      operationId: getMyPermissions
      tags: [ 我的权限 ]
      summary: 查看我的权限
      description: 权限中心按全部已登记应用汇总当前用户角色、可见菜单和按钮，aud 必须包含 permission-center。与 /auth/me
        按当前应用返回权限的用途不同。同一权限只返回一次，无权限的应用返回空菜单。
      x-ui-operations: [ M01 ]
      responses:
        '200':
          description: 当前用户的有效业务权限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyPermissions' }
              example:
                businessRoles:
                  - id: 3
                    name: 课程教师
                  - id: 8
                    name: 课程管理员
                applications:
                  - applicationId: 2
                    applicationName: 课程管理系统
                    menus:
                      - id: 101
                        name: 所有课程
                        code: course:viewAll
                        buttons:
                          - id: 102
                            name: 审核课程
                            code: course:review
                    applicationCode: course-project-management
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/operation-logs:
    get:
      operationId: listOperationLogs
      tags: [ 操作记录 ]
      summary: 查看或搜索操作记录
      description: >-
        总管理员查看全部记录。部门管理员查看本部门及下级部门用户的管理记录，

        以操作发生时用户所属的部门判断。同一批次涉及多部门时，只返回管理范围内的对象，

        搜索和分页同样基于筛选后的记录和对象。

        应用登记、角色权限配置、部门结构维护、跨部门调动等全局记录仅总管理员可见。
         包含 API 登记/编辑/移除、权限 API 关联变更、权限申请提交/撤回/审核，以及角色创建申请提交/通过/拒绝。申请和角色创建处理为 GLOBAL，只有总管理员查询；不记录读取、打开编辑或取消行为。密码与完整登录令牌不得写入 detail。
      x-ui-operations: [ O01 ]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          description: 搜索操作人、可见对象或操作内容
          schema: { $ref: '#/components/schemas/Keyword' }
      responses:
        '200':
          description: 可查看的操作记录分页结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationLogPage' }
              example:
                items:
                  - id: 130
                    occurredAt: 2026-11-10T09:15:00+08:00
                    actorName: 顾晨
                    action: 批量分配角色
                    targetNames:
                      - 林晓
                      - 何雨桐
                    detail: 课程管理员
                    result: SUCCESS
                page: 1
                pageSize: 20
                total: 1
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  "/api/v1/applications/{applicationId}/apis":
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    get:
      operationId: listApis
      tags:
        - API 登记
      summary: 查询应用 API 清单
      description: 仅总管理员。返回独立 API 登记及全部关联权限 ID，包含尚未关联权限的 API；按 ID 升序分页。
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: keyword
          schema:
            $ref: "#/components/schemas/Keyword"
          description: 按接口标识或请求路径搜索
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiPage"
              example:
                items:
                  - id: 1001
                    applicationId: 2
                    operationId: reviewCourse
                    httpMethod: POST
                    path: /courses/{courseId}/review
                    permissionIds:
                      - 102
                      - 105
                page: 1
                pageSize: 20
                total: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: registerApi
      tags:
        - API 登记
      summary: 登记 API
      description: 仅总管理员。从业务系统 API 文档填写
        operationId、httpMethod、path；不创建业务代码。接口标识及方法、路径组合各自在应用内唯一，区分大小写，方法使用大写。允许先登记而不关联权限；无关联时
        API 检查拒绝。登记及成功操作记录在一个事务提交。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiInput"
            example:
              operationId: reviewCourse
              httpMethod: POST
              path: /courses/{courseId}/review
      responses:
        "201":
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Api"
              example:
                id: 1001
                applicationId: 2
                operationId: reviewCourse
                httpMethod: POST
                path: /courses/{courseId}/review
                permissionIds: []
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/v1/applications/{applicationId}/apis/{apiId}":
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
      - $ref: "#/components/parameters/ApiId"
    patch:
      operationId: updateApi
      tags:
        - API 登记
      summary: 编辑 API 登记
      description: 仅总管理员。按 API 数字 ID 修改接口标识、方法或路径，所属应用固定，所有权限关联保留并共同引用新资料。唯一约束冲突
        409；不存在或不属于应用 404。operationId 变更须与业务系统实际标识一起调整；旧标识检查返回
        404，不保留隐式别名。变更及成功记录同一事务保存。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiUpdate"
            example:
              path: /courses/{courseId}/review
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Api"
              example:
                id: 1001
                applicationId: 2
                operationId: reviewCourse
                httpMethod: POST
                path: /courses/{courseId}/review
                permissionIds:
                  - 102
                  - 105
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteApi
      tags:
        - API 登记
      summary: 移除 API 登记
      description: 仅总管理员。删除 API 及其全部权限关联，不删除权限、角色和历史操作记录。成功后对应 operationId 检查返回 404
        并拒绝执行。与只解除某项权限的关联不同；删除和成功记录同一事务提交。
      responses:
        "204":
          description: 操作成功，无响应正文
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
