  "/api/v1/role-creation-requests/{requestId}/reviews":
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: reviewRoleCreationRequest
      tags:
        - 角色创建申请
      summary: 创建角色并通过或拒绝申请
      description: 仅总管理员处理 PENDING；已处理返回 409。APPROVE 提交在编辑表单调整后的完整
        role，在一个事务中创建业务角色及直接权限关联、将申请更新 APPROVED
        并保存审批人/时间/createdRoleId、写成功记录。角色重名等失败整次回滚，申请保持 PENDING。REJECT 只更新为
        REJECTED，不创建角色。成功创建也不自动分配给员工，按正常授权流程另行分配。没有独立的受理状态或只改状态的通过接口。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleCreationReview"
            example:
              decision: APPROVE
              role:
                name: 课程审核员
                description: 审核课程申请
                permissionIds:
                  - 101
                  - 102
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleCreationRequest"
              example:
                id: 41
                applicantUserId: 2
                applicantName: 顾晨
                name: 课程审核员
                description: 审核课程申请
                permissionIds:
                  - 101
                  - 102
                status: APPROVED
                reviewerUserId: 1
                createdRoleId: 8
                createdAt: 2026-11-15T09:00:00+08:00
                reviewedAt: 2026-11-15T09:10:00+08:00
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Authorization: Bearer <accessToken>。统一登录签发的 RS256
        JWT；中心验证签名、签发者、时效、目标应用及令牌和账号状态。当前用户由令牌确定，不读取请求方指定的 userId，不从 JWT
        读取角色权限。"
  parameters:
    ApplicationId:
      name: applicationId
      in: path
      required: true
      description: 应用 ID
      schema: { $ref: '#/components/schemas/Id' }
      example: 1
    PermissionId:
      name: permissionId
      in: path
      required: true
      description: 权限 ID
      schema: { $ref: '#/components/schemas/Id' }
      example: 102
    RoleId:
      name: roleId
      in: path
      required: true
      description: 业务角色 ID
      schema: { $ref: '#/components/schemas/Id' }
      example: 8
    DepartmentId:
      name: departmentId
      in: path
      required: true
      description: 部门 ID
      schema: { $ref: '#/components/schemas/Id' }
      example: 3
    UserId:
      name: userId
      in: path
      required: true
      description: 用户 ID
      schema: { $ref: '#/components/schemas/Id' }
      example: 12
    Page:
      name: page
      in: query
      description: 页码，从 1 开始
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      description: 每页条数
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ApplicationContext:
      name: X-Application-Code
      in: header
      required: false
      description: JWT aud 仅含一个应用时可省略，多个应用时必须填本次目标 code。省略且目标不明确返回 400；指定 aud 外的应用返回
        403。管理接口固定属于 permission-center，无需此头。
      schema:
        $ref: "#/components/schemas/ApplicationCode"
      example: course-project-management
    FrontendPermission:
      name: permission
      in: path
      required: true
      description: 当前应用内菜单或按钮的权限标识，与 operationId 不同。
      schema:
        $ref: "#/components/schemas/PermissionCode"
      example: course:review
    OperationId:
      name: operationId
      in: path
      required: true
      description: 业务系统 API 文档的接口标识，在目标应用内唯一。
      schema:
        $ref: "#/components/schemas/OperationId"
      example: listAdminCourses
    ApiId:
      name: apiId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
  responses:
    RoleCreated:
      description: 角色及其权限已保存
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RoleDetails' }
          example:
            id: 8
            name: 课程管理员
            description: 处理课程审核
            applications:
              - applicationId: 2
                applicationName: 课程管理系统
                permissionCount: 2
            permissionIds:
              - 101
              - 102
            permissions:
              - id: 101
                applicationId: 2
                name: 所有课程
                code: course:viewAll
                type: MENU
                parentId: null
              - id: 102
                applicationId: 2
                name: 审核课程
                code: course:review
                type: BUTTON
                parentId: 101
    RoleReturned:
      description: 角色信息及完整权限配置
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RoleDetails' }
          example:
            id: 8
            name: 课程管理员
            description: 审核课程并查看用户目录
            applications:
              - applicationId: 2
                applicationName: 课程管理系统
                permissionCount: 2
              - applicationId: 1
                applicationName: 权限管理系统
                permissionCount: 1
            permissionIds:
              - 101
              - 102
              - 201
            permissions:
              - id: 101
                applicationId: 2
                name: 所有课程
                code: course:viewAll
                type: MENU
                parentId: null
              - id: 102
                applicationId: 2
                name: 审核课程
                code: course:review
                type: BUTTON
                parentId: 101
              - id: 201
                applicationId: 1
                name: 用户与部门
                code: user:view
                type: MENU
                parentId: null
    UserReturned:
      description: 用户信息及其已有的业务角色
      content:
        application/json:
          schema: { $ref: '#/components/schemas/User' }
          example:
            id: 12
            username: lin.xiao
            name: 林晓
            department:
              id: 3
              name: 软件工程系
            status: ACTIVE
            departmentAdministrator: false
            businessRoles:
              - id: 3
                name: 课程教师
    UserTransferred:
      description: 保存后的用户信息
      content:
        application/json:
          schema: { $ref: '#/components/schemas/User' }
          examples:
            transfer:
              summary: 调动后保留原角色
              value:
                id: 12
                username: lin.xiao
                name: 林晓
                department:
                  id: 4
                  name: 数学学院
                status: ACTIVE
                departmentAdministrator: false
                businessRoles:
                  - id: 3
                    name: 课程教师
            disable:
              summary: 停用后的账号状态
              value:
                id: 12
                username: lin.xiao
                name: 林晓
                department:
                  id: 3
                  name: 软件工程系
                status: DISABLED
                departmentAdministrator: false
                businessRoles:
                  - id: 3
                    name: 课程教师
            appoint:
              summary: 指定部门管理员后的身份
              value:
                id: 12
                username: lin.xiao
                name: 林晓
                department:
                  id: 3
                  name: 软件工程系
                status: ACTIVE
                departmentAdministrator: true
                businessRoles:
                  - id: 3
                    name: 课程教师
    BadRequest:
      description: 请求格式、字段或关联不符合要求
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:rbac-admin:problem:invalid-request
            title: 请求不符合要求
            status: 400
            code: INVALID_REQUEST
            detail: 请检查请求参数及必填字段。
    Unauthorized:
      description: 登录凭据无效，或访问凭据缺失、过期或已撤销
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:rbac-admin:problem:unauthenticated
            title: 身份校验失败
            status: 401
            code: UNAUTHENTICATED
            detail: 请检查登录信息或访问凭据。
    Forbidden:
      description: 角色无权操作、对象超出管理范围，或令牌不包含目标应用。
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            outsideScope:
              value:
                type: urn:rbac-admin:problem:outside-management-scope
                title: 超出管理范围
                status: 403
                code: OUTSIDE_MANAGEMENT_SCOPE
                detail: 请选择本部门或下级部门内的对象。
            disabled:
              value:
                type: urn:rbac-admin:problem:account-disabled
                title: 账号已停用
                status: 403
                code: ACCOUNT_DISABLED
                detail: 请联系管理员确认账号状态。
            forbidden:
              value:
                type: urn:rbac-admin:problem:forbidden
                title: 操作不被允许
                status: 403
                code: FORBIDDEN
                detail: 当前角色无权执行该操作。
            applicationMismatch:
              value:
                type: urn:rbac-admin:problem:application-mismatch
                title: 应用不匹配
                status: 403
                code: APPLICATION_MISMATCH
                detail: 当前令牌不包含目标应用，请使用该应用的统一登录入口。
    NotFound:
      description: 目标资源或必需的关联资源不存在
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:rbac-admin:problem:not-found
            title: 对象不存在
            status: 404
            code: NOT_FOUND
            detail: 请检查目标 ID 后重试。
    Conflict:
      description: 应用名称或 code、用户名、应用内权限标识、API 标识或方法与路径组合重复，或待删除角色仍关联用户。
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:rbac-admin:problem:conflict
            title: 数据已存在
            status: 409
            code: CONFLICT
            detail: 同一应用内已存在相同的权限标识，请检查后重试。
    TooManyRequests:
      description: 登录尝试过于频繁
      headers:
        Retry-After:
          description: 可再次尝试前的等待秒数
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:rbac-admin:problem:too-many-requests
            title: 登录尝试过于频繁
            status: 429
            code: TOO_MANY_REQUESTS
            detail: 请稍后再试。
    InternalError:
      description: 系统暂时无法完成操作
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: urn:rbac-admin:problem:internal-error
            title: 系统暂时不可用
            status: 500
            code: INTERNAL_ERROR
            detail: 请稍后重试。
    ServiceUnavailable:
      description: 统一身份或权限检查暂不可用，调用方不能继续受保护操作
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:rbac-admin:problem:service-unavailable
            title: 身份或权限服务暂不可用
            status: 503
            code: SERVICE_UNAVAILABLE
            detail: 请稍后重新登录或重试操作。
  schemas:
    Id:
      type: integer
      format: int64
      minimum: 1
      maximum: 9007199254740991
      description: 数字 ID，取值范围可由浏览器安全表示。
    NullableId:
      oneOf:
        - $ref: '#/components/schemas/Id'
        - type: 'null'
    IdList:
      type: array
      uniqueItems: true
      items: { $ref: '#/components/schemas/Id' }
    RequiredIdList:
      allOf:
        - $ref: '#/components/schemas/IdList'
        - minItems: 1
    Name:
      type: string
      minLength: 1
      maxLength: 24
    Username:
      type: string
      minLength: 1
      maxLength: 32
    Keyword:
      type: string
      maxLength: 100
    Description:
      type: string
      maxLength: 48
      default: ''
    PermissionCode:
      type: string
      maxLength: 64
      pattern: '^[^:\s]+:[^:\s]+$'
      example: course:review
    ManagementRole:
      type: string
      enum: [ TOTAL_ADMIN, DEPARTMENT_ADMIN, NONE ]
    AccountStatus:
      type: string
      enum: [ ACTIVE, DISABLED ]
    PermissionType:
      type: string
      enum: [ MENU, BUTTON ]
    BatchAction:
      type: string
      enum: [ GRANT, REVOKE ]
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
        - systems
      properties:
        username:
          $ref: "#/components/schemas/Username"
        password:
          type: string
          minLength: 1
          format: password
          writeOnly: true
        systems:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ApplicationCode"
          description: 本次登录的目标应用。同一账号可登录所有已接入系统，各应用功能权限分别计算。
    LoginResult:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          minLength: 1
          description: RS256 JWT，不包含角色和权限。
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          minimum: 1
          description: 有效时长，单位秒。
    Application:
      type: object
      required:
        - id
        - name
        - code
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          $ref: "#/components/schemas/Name"
        code:
          $ref: "#/components/schemas/ApplicationCode"
    ApplicationInput:
      type: object
      additionalProperties: false
      required: [ name ]
      properties:
        name: { $ref: '#/components/schemas/Name' }
    ApplicationPermissions:
      type: object
      required: [ applicationId, applicationName, menus ]
      properties:
        applicationId: { $ref: '#/components/schemas/Id' }
        applicationName: { $ref: '#/components/schemas/Name' }
        menus:
          type: array
          items: { $ref: '#/components/schemas/MenuNode' }
        applicationCode:
          $ref: "#/components/schemas/ApplicationCode"
    MenuNode:
      type: object
      required: [ id, name, code, buttons ]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { $ref: '#/components/schemas/Name' }
        code: { $ref: '#/components/schemas/PermissionCode' }
        buttons:
          type: array
          items: { $ref: '#/components/schemas/PermissionRef' }
        apiCount:
          type: integer
          minimum: 0
          readOnly: true
          description: 应用权限管理中返回的关联 API 数量。
    PermissionRef:
      type: object
      required: [ id, name, code ]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { $ref: '#/components/schemas/Name' }
        code: { $ref: '#/components/schemas/PermissionCode' }
        apiCount:
          type: integer
          minimum: 0
          readOnly: true
          description: 应用权限管理中返回的关联 API 数量。
    Permission:
      allOf:
        - $ref: '#/components/schemas/PermissionRef'
        - type: object
          required: [ applicationId, type, parentId, apis ]
          properties:
            applicationId: { $ref: '#/components/schemas/Id' }
            type: { $ref: '#/components/schemas/PermissionType' }
            parentId: { $ref: '#/components/schemas/NullableId' }
            apis:
              type: array
              items:
                $ref: "#/components/schemas/Api"
    PermissionCreate:
      oneOf:
        - title: 新增菜单权限
          type: object
          additionalProperties: false
          required:
            - name
            - code
            - type
          properties:
            name:
              $ref: "#/components/schemas/Name"
            code:
              $ref: "#/components/schemas/PermissionCode"
            type:
              type: string
              const: MENU
            parentId:
              type: "null"
            apiIds:
              $ref: "#/components/schemas/IdList"
              default: []
              description: 已登记且属于同一应用的 API ID，可为空；可被其他权限同时引用。
        - title: 新增按钮权限
          type: object
          additionalProperties: false
          required:
            - name
            - code
            - type
            - parentId
          properties:
            name:
              $ref: "#/components/schemas/Name"
            code:
              $ref: "#/components/schemas/PermissionCode"
            type:
              type: string
              const: BUTTON
            parentId:
              $ref: "#/components/schemas/Id"
            apiIds:
              $ref: "#/components/schemas/IdList"
              default: []
              description: 已登记且属于同一应用的 API ID，可为空；可被其他权限同时引用。
    PermissionUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { $ref: '#/components/schemas/Name' }
        code: { $ref: '#/components/schemas/PermissionCode' }
        apiIds:
          $ref: "#/components/schemas/IdList"
          description: 省略保留关联，提供则完整替换，[] 只解除全部关联，保留 API 登记及其他权限关联。
    RoleRef:
      type: object
      required: [ id, name ]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { $ref: '#/components/schemas/Name' }
    RoleApplicationSummary:
      type: object
      required: [ applicationId, applicationName, permissionCount ]
      properties:
        applicationId: { $ref: '#/components/schemas/Id' }
        applicationName: { $ref: '#/components/schemas/Name' }
        permissionCount: { type: integer, minimum: 1 }
    RoleSummary:
      allOf:
        - $ref: '#/components/schemas/RoleRef'
        - type: object
          required: [ description, applications ]
          properties:
            description: { $ref: '#/components/schemas/Description' }
            applications:
              type: array
              description: 该角色已获授权的应用及权限数量
              items: { $ref: '#/components/schemas/RoleApplicationSummary' }
    RoleDetails:
      allOf:
        - $ref: "#/components/schemas/RoleSummary"
        - type: object
          required:
            - permissionIds
            - permissions
          properties:
            permissionIds:
              $ref: "#/components/schemas/IdList"
            permissions:
              type: array
              items:
                $ref: "#/components/schemas/PermissionSummary"
    RoleInput:
      type: object
      additionalProperties: false
      required: [ name, permissionIds ]
      properties:
        name: { $ref: '#/components/schemas/Name' }
        description: { $ref: '#/components/schemas/Description' }
        permissionIds: { $ref: '#/components/schemas/IdList' }
    DepartmentRef:
      type: object
      required: [ id, name ]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { $ref: '#/components/schemas/Name' }
    Department:
      allOf:
        - $ref: '#/components/schemas/DepartmentRef'
        - type: object
          required: [ parentId ]
          properties:
            parentId: { $ref: '#/components/schemas/NullableId' }
    DepartmentNode:
      allOf:
        - $ref: '#/components/schemas/Department'
        - type: object
          required: [ children ]
          properties:
            children:
              type: array
              items: { $ref: '#/components/schemas/DepartmentNode' }
    DepartmentTree:
      type: object
      required: [ departments ]
      properties:
        departments:
          type: array
          items: { $ref: '#/components/schemas/DepartmentNode' }
    DepartmentInput:
      type: object
      additionalProperties: false
      required: [ name, parentId ]
      properties:
        name: { $ref: '#/components/schemas/Name' }
        parentId: { $ref: '#/components/schemas/NullableId' }
    DepartmentUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { $ref: '#/components/schemas/Name' }
        parentId: { $ref: '#/components/schemas/NullableId' }
    User:
      type: object
      required:
        [
          id,
          username,
          name,
          department,
          status,
          departmentAdministrator,
          businessRoles
        ]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        username: { $ref: '#/components/schemas/Username' }
        name: { $ref: '#/components/schemas/Name' }
        department: { $ref: '#/components/schemas/DepartmentRef' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        departmentAdministrator: { type: boolean }
        businessRoles:
          type: array
          items: { $ref: '#/components/schemas/RoleRef' }
    UserCreate:
      type: object
      additionalProperties: false
      required:
        - username
        - name
        - departmentId
        - initialPassword
      properties:
        username: { $ref: '#/components/schemas/Username' }
        name: { $ref: '#/components/schemas/Name' }
        departmentId: { $ref: '#/components/schemas/Id' }
        status:
          $ref: '#/components/schemas/AccountStatus'
          default: ACTIVE
        departmentAdministrator:
          type: boolean
          description: 仅总管理员可提交，省略时创建为普通用户。
        initialPassword:
          type: string
          minLength: 1
          format: password
          writeOnly: true
          description: 新增用户表单填写的初始密码。仅传输和校验一次，数据库保存密码摘要，日志不得包含密码。
    UserCreated:
      type: object
      required:
        - user
      properties:
        user: { $ref: '#/components/schemas/User' }
    UserUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        username: { $ref: '#/components/schemas/Username' }
        name: { $ref: '#/components/schemas/Name' }
        departmentId:
          $ref: '#/components/schemas/Id'
          description: 仅总管理员可提交。
        status: { $ref: '#/components/schemas/AccountStatus' }
        departmentAdministrator:
          type: boolean
          description: 仅总管理员可提交，true 分配部门管理员角色，false 撤销该角色。
    ReplaceUserRoles:
      type: object
      additionalProperties: false
      required: [ roleIds ]
      properties:
        roleIds: { $ref: '#/components/schemas/IdList' }
    UserRoleResult:
      type: object
      required: [ userId, roleIds ]
      properties:
        userId: { $ref: '#/components/schemas/Id' }
        roleIds: { $ref: '#/components/schemas/IdList' }
    BatchRoleChange:
      type: object
      additionalProperties: false
      required: [ action, userIds, roleIds ]
      properties:
        action: { $ref: '#/components/schemas/BatchAction' }
        userIds: { $ref: '#/components/schemas/RequiredIdList' }
        roleIds: { $ref: '#/components/schemas/RequiredIdList' }
    BatchRoleResult:
      type: object
      required: [ action, affectedUsers ]
      properties:
        action: { $ref: '#/components/schemas/BatchAction' }
        affectedUsers:
          type: integer
          minimum: 0
          description: 业务角色实际发生变化的用户数。
    MyPermissions:
      type: object
      required: [ businessRoles, applications ]
      properties:
        businessRoles:
          type: array
          items: { $ref: '#/components/schemas/RoleRef' }
        applications:
          type: array
          items: { $ref: '#/components/schemas/ApplicationPermissions' }
    OperationLog:
      type: object
      required:
        [
          id,
          occurredAt,
          actorName,
          action,
          targetNames,
          detail,
          result
        ]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        occurredAt: { type: string, format: date-time }
        actorName: { type: string }
        action: { type: string }
        targetNames:
          type: array
          items: { type: string }
        detail: { type: string }
        result: { type: string, enum: [ SUCCESS, FAILURE ] }
    PermissionCheckResult:
      type: object
      required: [ allowed ]
      properties:
        allowed: { type: boolean }
    PageMetadata:
      type: object
      required: [ page, pageSize, total ]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    ApplicationPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [ items ]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Application' }
    RolePage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [ items ]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/RoleSummary' }
    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [ items ]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/User' }
    OperationLogPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [ items ]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/OperationLog' }
    Problem:
      type: object
      required: [ type, title, status, code, detail ]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - UNAUTHENTICATED
            - FORBIDDEN
            - ACCOUNT_DISABLED
            - OUTSIDE_MANAGEMENT_SCOPE
            - APPLICATION_MISMATCH
            - NOT_FOUND
            - CONFLICT
            - TOO_MANY_REQUESTS
            - INTERNAL_ERROR
            - SERVICE_UNAVAILABLE
        detail: { type: string }
    ApplicationCode:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[a-z][a-z0-9_-]*$
      description: 稳定的系统接入标识，供 systems 和 aud 使用。
      example: course-project-management
    OperationId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^\S+$
      example: reviewCourse
    HttpMethod:
      type: string
      enum:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - HEAD
        - OPTIONS
      example: POST
    AuthUser:
      type: object
      required:
        - subject
        - roles
        - permissions
        - name
        - no
      properties:
        subject:
          type: string
          minLength: 1
          description: 用户数字 ID 的字符串形式，跨应用不变。
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
          description: 为当前应用提供权限的角色 ID 字符串；本系统也包含内置管理角色。
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PermissionCode"
          description: 当前应用内有效菜单和按钮权限标识。
        name:
          $ref: "#/components/schemas/Name"
        no:
          $ref: "#/components/schemas/Username"
          description: 统一账号用户名，可采用学号或工号。
        id:
          $ref: "#/components/schemas/Id"
        departmentId:
          $ref: "#/components/schemas/NullableId"
        managementRole:
          $ref: "#/components/schemas/ManagementRole"
    ApplicationCreate:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          $ref: "#/components/schemas/Name"
        code:
          $ref: "#/components/schemas/ApplicationCode"
    ApiInput:
      type: object
      additionalProperties: false
      required:
        - operationId
        - httpMethod
        - path
      properties:
        operationId:
          $ref: "#/components/schemas/OperationId"
        httpMethod:
          $ref: "#/components/schemas/HttpMethod"
        path:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^/[^?#\s]*$
          description: 不含域名和查询参数的请求路径模板。
          example: /courses/{courseId}/review
    Api:
      type: object
      required:
        - id
        - applicationId
        - operationId
        - httpMethod
        - path
        - permissionIds
      properties:
        id:
          $ref: "#/components/schemas/Id"
        applicationId:
          $ref: "#/components/schemas/Id"
        operationId:
          $ref: "#/components/schemas/OperationId"
        httpMethod:
          $ref: "#/components/schemas/HttpMethod"
        path:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^/[^?#\s]*$
          description: 不含域名和查询参数的请求路径模板。
          example: /courses/{courseId}/review
        permissionIds:
          $ref: "#/components/schemas/IdList"
          description: 全部关联权限 ID，可为空。权限必须与 API 属于同一应用。
    ApiCheckResult:
      type: object
      required:
        - operationId
        - allowed
      properties:
        operationId:
          $ref: "#/components/schemas/OperationId"
        allowed:
          type: boolean
    JwkSet:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RsaPublicJwk"
    RsaPublicJwk:
      type: object
      additionalProperties: false
      required:
        - kty
        - use
        - alg
        - kid
        - n
        - e
      properties:
        kty:
          type: string
          const: RSA
        use:
          type: string
          const: sig
        alg:
          type: string
          const: RS256
        kid:
          type: string
          minLength: 1
        n:
          type: string
          minLength: 1
          description: RSA 公钥模数，Base64URL 编码。
        e:
          type: string
          minLength: 1
          description: RSA 公钥指数，Base64URL 编码。
    ApiUpdate:
      type: object
      additionalProperties: false
      properties:
        operationId:
          $ref: "#/components/schemas/OperationId"
        httpMethod:
          $ref: "#/components/schemas/HttpMethod"
        path:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^/[^?#\s]*$
          description: 不含域名和查询参数的请求路径模板。
          example: /courses/{courseId}/review
      minProperties: 1
    ApiPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Api"
    PermissionSummary:
      type: object
      required:
        - id
        - applicationId
        - name
        - code
        - type
        - parentId
      properties:
        id:
          $ref: "#/components/schemas/Id"
        applicationId:
          $ref: "#/components/schemas/Id"
        name:
          $ref: "#/components/schemas/Name"
        code:
          $ref: "#/components/schemas/PermissionCode"
        type:
          $ref: "#/components/schemas/PermissionType"
        parentId:
          $ref: "#/components/schemas/NullableId"
    PermissionCatalogApplication:
      type: object
      required:
        - id
        - name
        - code
        - permissions
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          $ref: "#/components/schemas/Name"
        code:
          $ref: "#/components/schemas/ApplicationCode"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionSummary"
    PermissionCatalog:
      type: object
      required:
        - applications
      properties:
        applications:
          type: array
          items:
            $ref: "#/components/schemas/PermissionCatalogApplication"
    RequestablePermissionGroup:
      type: object
      required:
        - menu
        - permissions
      properties:
        menu:
          $ref: "#/components/schemas/PermissionSummary"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionSummary"
    RequestableApplication:
      type: object
      required:
        - id
        - name
        - code
        - groups
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          $ref: "#/components/schemas/Name"
        code:
          $ref: "#/components/schemas/ApplicationCode"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/RequestablePermissionGroup"
    RequestablePermissions:
      type: object
      required:
        - applications
      properties:
        applications:
          type: array
          items:
            $ref: "#/components/schemas/RequestableApplication"
    PermissionRequestStatus:
      type: string
      enum:
        - PENDING
        - APPROVED
        - REJECTED
        - SATISFIED
        - WITHDRAWN
    PermissionRequestInput:
      type: object
      required:
        - permissionId
        - reason
      properties:
        permissionId:
          $ref: "#/components/schemas/Id"
        reason:
          type: string
          minLength: 1
          maxLength: 500
      additionalProperties: false
    PermissionRequestReview:
      oneOf:
        - type: object
          required:
            - decision
            - roleId
          properties:
            decision:
              type: string
              const: APPROVE
            roleId:
              $ref: "#/components/schemas/Id"
          additionalProperties: false
        - type: object
          required:
            - decision
          properties:
            decision:
              type: string
              const: REJECT
          additionalProperties: false
    PermissionRequest:
      type: object
      required:
        - id
        - applicantUserId
        - applicantName
        - applicantDepartmentId
        - permission
        - reason
        - status
        - reviewerUserId
        - approvedRoleId
        - createdAt
        - reviewedAt
      properties:
        id:
          $ref: "#/components/schemas/Id"
        applicantUserId:
          $ref: "#/components/schemas/Id"
        applicantName:
          $ref: "#/components/schemas/Name"
        applicantDepartmentId:
          $ref: "#/components/schemas/NullableId"
        permission:
          $ref: "#/components/schemas/PermissionSummary"
        reason:
          type: string
          minLength: 1
          maxLength: 500
        status:
          $ref: "#/components/schemas/PermissionRequestStatus"
        reviewerUserId:
          $ref: "#/components/schemas/NullableId"
        approvedRoleId:
          $ref: "#/components/schemas/NullableId"
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type:
            - string
            - "null"
          format: date-time
    RoleApprovalOption:
      type: object
      required:
        - role
        - selectable
        - extraPermissionIds
      properties:
        role:
          $ref: "#/components/schemas/RoleDetails"
        selectable:
          type: boolean
        extraPermissionIds:
          $ref: "#/components/schemas/IdList"
    PermissionRequestDetails:
      allOf:
        - $ref: "#/components/schemas/PermissionRequest"
        - type: object
          required: []
          properties:
            approvalRoles:
              type: array
              items:
                $ref: "#/components/schemas/RoleApprovalOption"
    PermissionRequestPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PermissionRequest"
    RoleCreationRequestStatus:
      type: string
      enum:
        - PENDING
        - APPROVED
        - REJECTED
    RoleCreationRequest:
      type: object
      required:
        - id
        - applicantUserId
        - applicantName
        - name
        - description
        - permissionIds
        - status
        - reviewerUserId
        - createdRoleId
        - createdAt
        - reviewedAt
      properties:
        id:
          $ref: "#/components/schemas/Id"
        applicantUserId:
          $ref: "#/components/schemas/Id"
        applicantName:
          $ref: "#/components/schemas/Name"
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
        permissionIds:
          $ref: "#/components/schemas/IdList"
        status:
          $ref: "#/components/schemas/RoleCreationRequestStatus"
        reviewerUserId:
          $ref: "#/components/schemas/NullableId"
        createdRoleId:
          $ref: "#/components/schemas/NullableId"
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type:
            - string
            - "null"
          format: date-time
    RoleCreationReview:
      oneOf:
        - type: object
          required:
            - decision
            - role
          properties:
            decision:
              type: string
              const: APPROVE
            role:
              $ref: "#/components/schemas/RoleInput"
          additionalProperties: false
        - type: object
          required:
            - decision
          properties:
            decision:
              type: string
              const: REJECT
          additionalProperties: false
    RoleCreationRequestPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/RoleCreationRequest"
