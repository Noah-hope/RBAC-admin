<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="1830" viewBox="0 0 2300 1830"><rect x="0" y="0" width="2300" height="1830" fill="white" /><text text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="32" x="42" y="47.0" fill="#243a52">集中权限管理系统 · 顶层数据流图</text><text text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="20" x="42" y="88.0" fill="#243a52">系统上下文：一个整体处理过程、五类外部实体；箭头表示数据传递，不表示执行顺序</text><line stroke-width="2.5" x1="370" y1="340" x2="900" y2="600" stroke="#4d6783" /><polygon points="885.0235743382269,599.159360721008 900,600 890.1688614664379,588.6708908058087" fill="#4d6783" /><line stroke-width="2.5" x1="900" y1="780" x2="370" y2="550" stroke="#4d6783" /><polygon points="384.9993320480301,550.141556041685 370,550 380.34858918488214,560.8584852480693" fill="#4d6783" /><line stroke-width="2.5" x1="370" y1="1160" x2="900" y2="1080" stroke="#4d6783" /><polygon points="887.2106619956936,1087.837910015534 900,1080 885.4670099147255,1076.28621497912" fill="#4d6783" /><line stroke-width="2.5" x1="900" y1="1200" x2="370" y2="1370" stroke="#4d6783" /><polygon points="381.37163941053586,1360.2180872465174 370,1370 384.9398121679555,1371.3423905490608" fill="#4d6783" /><line stroke-width="2.5" x1="1150" y1="255" x2="1150" y2="550" stroke="#4d6783" /><polygon points="1144.1587248653702,536.1840850899567 1150,550 1155.8412751346298,536.1840850899567" fill="#4d6783" /><line stroke-width="2.5" x1="1400" y1="600" x2="1900" y2="340" stroke="#4d6783" /><polygon points="1890.4371764362222,351.5564875930387 1900,340 1885.0473998985417,341.19153271288394" fill="#4d6783" /><line stroke-width="2.5" x1="1900" y1="510" x2="1400" y2="820" stroke="#4d6783" /><polygon points="1408.6641836853432,807.7553309123263 1400,820 1414.8201828556867,817.6843618322351" fill="#4d6783" /><line stroke-width="2.5" x1="1400" y1="980" x2="1900" y2="680" stroke="#4d6783" /><polygon points="1891.1582619654428,692.1170816836508 1900,680 1885.14763943934,682.0993774734795" fill="#4d6783" /><line stroke-width="2.5" x1="1900" y1="1160" x2="1400" y2="1120" stroke="#4d6783" /><polygon points="1414.2377288533128,1115.2790809052108 1400,1120 1413.3061012852597,1126.924425505875" fill="#4d6783" /><line stroke-width="2.5" x1="1400" y1="1220" x2="1900" y2="1370" stroke="#4d6783" /><polygon points="1885.0882754858346,1371.6249529265917 1900,1370 1888.4452316037289,1360.4350992002774" fill="#4d6783" /><rect x="493.0" y="423.5" width="284.0" height="93" fill="white" /><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" x="635.0" y="445.5" fill="#243a52">F01 后台身份与管理请求</text><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" x="635.0" y="474.5" fill="#243a52">目录／角色／授权／账号与范围</text><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" x="635.0" y="503.5" fill="#243a52">导入指令、映射及审计查询</text><rect x="521.5" y="618.5" width="227.0" height="93" fill="white" /><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" x="635.0" y="640.5" fill="#243a52">F02 身份与全局管理范围</text><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" x="635.0" y="669.5" fill="#243a52">配置数据、办理状态</text><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" x="635.0" y="698.5" fill="#243a52">导入报告及审计记录</text><rect x="493.0" y="1073.5" width="284.0" height="93" fill="white" /><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" x="635.0" y="1095.5" fill="#243a52">F03 后台身份与本公司管理请求</text><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" x="635.0" y="1124.5" fill="#243a52">角色配置／分配／撤销申请</text><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" x="635.0" y="1153.5" fill="#243a52">范围内查询及本人账号操作</text><rect x="512.0" y="1238.5" width="246.0" height="93" fill="white" /><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" x="635.0" y="1260.5" fill="#243a52">F04 身份与本公司管理范围</text><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" x="635.0" y="1289.5" fill="#243a52">范围内配置、申请执行状态</text><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" x="635.0" y="1318.5" fill="#243a52">及授权审计记录</text><rect x="1248.5" y="280.5" width="303.0" height="64" fill="white" /><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" x="1400.0" y="302.5" fill="#243a52">F05 组织、岗位、员工、任职数据</text><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" x="1400.0" y="331.5" fill="#243a52">及明确的人员变更数据</text><rect x="1527.0" y="423.5" width="246.0" height="93" fill="white" /><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" x="1650.0" y="445.5" fill="#243a52">F06 固定权限变更申请</text><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" x="1650.0" y="474.5" fill="#243a52">角色配置／分配／撤销方案</text><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" x="1650.0" y="503.5" fill="#243a52">申请编号、版本及关联信息</text><rect x="1546.0" y="633.0" width="208.0" height="64" fill="white" /><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" x="1650.0" y="655.0" fill="#243a52">F07 外部审批关联信息</text><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" x="1650.0" y="684.0" fill="#243a52">最终批准／驳回结果</text><rect x="1517.5" y="798.0" width="265.0" height="64" fill="white" /><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" x="1650.0" y="820.0" fill="#243a52">F08 审批结果接收／处理状态</text><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" x="1650.0" y="849.0" fill="#243a52">含重复、拒绝及执行状态</text><rect x="1498.5" y="1093.5" width="303.0" height="93" fill="white" /><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" x="1650.0" y="1115.5" fill="#243a52">F09 受信权限查询／校验请求</text><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" x="1650.0" y="1144.5" fill="#243a52">调用身份、员工、当前公司、系统</text><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" x="1650.0" y="1173.5" fill="#243a52">指定权限编码（单项校验）</text><rect x="1508.0" y="1248.5" width="284.0" height="93" fill="white" /><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" x="1650.0" y="1270.5" fill="#243a52">F10 系统进入资格、可见菜单</text><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" x="1650.0" y="1299.5" fill="#243a52">允许操作及范围／单项校验结果</text><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" x="1650.0" y="1328.5" fill="#243a52">调用或服务错误信息</text><rect stroke-width="2" rx="24" x="900" y="550" width="500" height="700" fill="#b9d7ff" stroke="#1c4e8a" /><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="30" x="1150.0" y="890.0" fill="#243a52">0</text><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="30" x="1150.0" y="930.0" fill="#243a52">集中权限管理系统</text><rect stroke-width="2" rx="0" x="70" y="300" width="300" height="300" fill="#f7f9fc" stroke="#71869a" /><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="23" x="220.0" y="456.5" fill="#243a52">权限中心总管理员</text><rect stroke-width="2" rx="0" x="70" y="1120" width="300" height="300" fill="#f7f9fc" stroke="#71869a" /><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="23" x="220.0" y="1276.5" fill="#243a52">公司权限管理专员</text><rect stroke-width="2" rx="0" x="1010" y="130" width="280" height="125" fill="#f7f9fc" stroke="#71869a" /><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="23" x="1150.0" y="182.5" fill="#243a52">HR 系统</text><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="23" x="1150.0" y="215.5" fill="#243a52">人员组织数据来源</text><rect stroke-width="2" rx="0" x="1900" y="300" width="300" height="420" fill="#f7f9fc" stroke="#71869a" /><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="23" x="2050.0" y="516.5" fill="#243a52">OA 系统</text><rect stroke-width="2" rx="0" x="1900" y="1120" width="300" height="300" fill="#f7f9fc" stroke="#71869a" /><text text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="23" x="2050.0" y="1276.5" fill="#243a52">业务系统后端</text><rect stroke-width="2" rx="0" x="45" y="1580" width="710" height="175" fill="#fff8e8" stroke="#c4a34f" /><text text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="20" x="65" y="1627.5" fill="#243a52">读图与层级</text><text text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="20" x="65" y="1657.5" fill="#243a52">矩形：外部实体；圆角矩形：整体处理过程。</text><text text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="20" x="65" y="1687.5" fill="#243a52">本图不展开数据库、内部模块和审批步骤。</text><text text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="20" x="65" y="1717.5" fill="#243a52">此处“顶层”指上下文图，第一层分解另画。</text><rect stroke-width="2" rx="0" x="790" y="1580" width="710" height="175" fill="#fff8e8" stroke="#c4a34f" /><text text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="20" x="810" y="1627.5" fill="#243a52">一期外部对接</text><text text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="20" x="810" y="1657.5" fill="#243a52">HR 以文件／模拟数据提供资料，管理员上传确认。</text><text text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="20" x="810" y="1687.5" fill="#243a52">OA 模拟外部审批；结果接收不等于权限已生效。</text><text text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="20" x="810" y="1717.5" fill="#243a52">业务系统使用简单、真实的 HTTP 调用演示。</text><rect stroke-width="2" rx="0" x="1535" y="1580" width="710" height="175" fill="#fff8e8" stroke="#c4a34f" /><text text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="20" x="1555" y="1627.5" fill="#243a52">边界与有效权限</text><text text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="20" x="1555" y="1657.5" fill="#243a52">普通员工不直接操作权限管理后台。</text><text text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="20" x="1555" y="1687.5" fill="#243a52">公司数据隔离、SELF 过滤由业务系统实施。</text><text text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="20" x="1555" y="1717.5" fill="#243a52">没有权限与调用失败／服务故障分别返回。</text></svg>