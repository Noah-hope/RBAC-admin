<text x="50.0" y="1659.8" text-anchor="start" font-size="20.0" font-weight="bold" fill="#3A5570" font-family="'Songti SC', 'SimSun', 'STSong', serif">虚线空心箭头表示包依赖（展示主要源码依赖）。结构化实现采用自上而下依赖：controller → service → mapper → entity。</text>
<text x="50.0" y="1693.8" text-anchor="start" font-size="20.0" font-weight="bold" fill="#3A5570" font-family="'Songti SC', 'SimSun', 'STSong', serif">与 DDD 版的差异：没有独立 domain 层和仓储端口，没有依赖倒置；Service 直接消费 DTO、返回 VO，并通过 JPA Mapper 操作贫血实体表记录。</text>
