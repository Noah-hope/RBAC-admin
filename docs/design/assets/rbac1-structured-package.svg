<text x="694.0" y="1212.0" text-anchor="start" font-size="18.0" font-weight="normal" fill="#3A5570" font-family="'STFangsong', 'FangSong', 'Songti SC', serif">RoleMapper、RolePermissionMapper、RoleInheritanceMapper、UserRoleMapper、PermissionRequestMapper</text>
