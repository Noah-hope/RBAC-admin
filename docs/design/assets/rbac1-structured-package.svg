<text x="50.0" y="69.6" text-anchor="start" font-size="40.0" font-weight="bold" fill="#14283D" font-family="'PingFang SC', 'Heiti SC', 'SimHei', 'Microsoft YaHei', sans-serif">RBAC1 结构化包图 · rbac1-structured 后端分层</text>
<text x="50.0" y="114.0" text-anchor="start" font-size="21.0" font-weight="bold" fill="#3A5570" font-family="'Songti SC', 'SimSun', 'STSong', serif">包 com.rbac.rbac1。面向功能的经典三层结构：controller 调 service，service 集中全部业务规则并直接依赖 mapper、entity、dto 与 vo；无独立领域层和仓储端口。</text>
