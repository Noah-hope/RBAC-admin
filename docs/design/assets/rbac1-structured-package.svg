<text x="104.0" y="1452.0" text-anchor="start" font-size="18.0" font-weight="normal" fill="#3A5570" font-family="'STFangsong', 'FangSong', 'Songti SC', serif">Role、RolePermission、RoleInheritance、Permission、PermissionRequest、RoleCreationRequest、UserAccount、UserRole（贫血 JPA 实体 + 状态常量，无业务方法）</text>
