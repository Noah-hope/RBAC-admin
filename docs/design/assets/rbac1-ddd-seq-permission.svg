<text x="50.0" y="2468.4" text-anchor="start" font-size="20.0" font-weight="bold" fill="#3A5570" font-family="'Songti SC', 'SimSun', 'STSong', serif">实线实心箭头：同步消息（按序编号）　虚线空心箭头：返回或未捕获异常（红色直返调用方，不逐段转发）</text>
<text x="50.0" y="2502.4" text-anchor="start" font-size="20.0" font-weight="bold" fill="#3A5570" font-family="'Songti SC', 'SimSun', 'STSong', serif">首次 save(permission) 先触发唯一约束检查并回填新权限 ID，linkApis 校验失败时整个 @Transactional 事务原子回滚。</text>
