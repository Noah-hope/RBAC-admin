<text x="50.0" y="2763.8" text-anchor="start" font-size="20.0" font-weight="bold" fill="#3A5570" font-family="'Songti SC', 'SimSun', 'STSong', serif">同步消息：实线实心箭头并编号；回复与异常：虚线空心箭头，不编号。«MetaClass» : ApprovalRules 表示静态纯计算方法 extraPermissions。</text>
<text x="50.0" y="2797.8" text-anchor="start" font-size="20.0" font-weight="bold" fill="#3A5570" font-family="'Songti SC', 'SimSun', 'STSong', serif">与 DDD 版对比：没有 PermissionRequest.approve/reject/settleWith 和 ApprovalCandidates 领域对象，全部状态流转和候选计算集中在 PermissionRequestService；requireVisible 内部同时校验部门管理员审核范围。</text>
