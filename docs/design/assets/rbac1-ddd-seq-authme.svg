<text x="50.0" y="2199.6" text-anchor="start" font-size="20.0" font-weight="bold" fill="#3A5570" font-family="'Songti SC', 'SimSun', 'STSong', serif">实线实心箭头：同步消息（按序编号）　虚线空心箭头：返回或未捕获异常（红色直返调用方，不逐段转发）</text>
<text x="50.0" y="2233.6" text-anchor="start" font-size="20.0" font-weight="bold" fill="#3A5570" font-family="'Songti SC', 'SimSun', 'STSong', serif">课程管理系统等启用角色码映射的应用走 alt 上分支返回 teacher/student/admin；常规应用走下分支返回提供有效权限的直接角色 ID。</text>
