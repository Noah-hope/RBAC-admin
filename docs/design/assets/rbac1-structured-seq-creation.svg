<text x="50.0" y="2703.8" text-anchor="start" font-size="20.0" font-weight="bold" fill="#3A5570" font-family="'Songti SC', 'SimSun', 'STSong', serif">同步消息：实线实心箭头并编号；回复与异常：虚线空心箭头，不编号。«MetaClass» 表示静态方法调用（CloneFactory.copy、DuplicateKeys.saveAndFlush）。</text>
<text x="50.0" y="2737.8" text-anchor="start" font-size="20.0" font-weight="bold" fill="#3A5570" font-family="'Songti SC', 'SimSun', 'STSong', serif">RoleService.create 加入同一事务：任一校验或重名异常都会使整个事务回滚，申请保持“待审核”；与 DDD 版对比，审批状态变更直接由 Service 改写贫血实体字段。</text>
