<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1820" viewBox="0 0 3000 1820"><rect x="0" y="0" width="3000" height="1820" fill="white" /><text text-anchor="middle" font-size="22" font-family="Microsoft YaHei,sans-serif" x="1500.0" y="45.0" fill="#213b58">集中权限管理系统 · 第一层数据流图</text><text text-anchor="middle" font-size="22" font-family="Microsoft YaHei,sans-serif" x="1500.0" y="107.5" fill="#213b58">蓝色圆角框：处理过程；灰色框：外部实体；双横线：数据存储。重复引用不是新增副本；本图不表示执行顺序。</text><text text-anchor="middle" font-size="22" font-family="Microsoft YaHei,sans-serif" x="1500.0" y="190.0" fill="#213b58">6.0 查询与校验有效访问权限  ｜  UC-05、06</text><line stroke-width="2" x1="390" y1="922.5" x2="1040" y2="922.5" stroke="#4d6783" /><polygon points="1028.0262070779625,927.5624384500125 1040,922.5 1028.0262070779625,917.4375615499875" fill="#4d6783" /><rect x="523.5" y="884.5" width="383.0" height="40" fill="white" /><text text-anchor="middle" font-size="20" font-family="Microsoft YaHei,sans-serif" x="715.0" y="908.5" fill="#213b58">F09 调用身份、员工、公司、系统及权限</text><line stroke-width="2" x1="1040" y1="1067.5" x2="390" y2="1067.5" stroke="#4d6783" /><polygon points="401.9737929220375,1062.4375615499875 390,1067.5 401.9737929220375,1072.5624384500125" fill="#4d6783" /><rect x="523.5" y="1029.5" width="383.0" height="40" fill="white" /><text text-anchor="middle" font-size="20" font-family="Microsoft YaHei,sans-serif" x="715.0" y="1053.5" fill="#213b58">F10 进入资格、菜单、操作／范围或错误</text><line stroke-width="2" x1="2350" y1="365" x2="1500" y2="365" stroke="#4d6783" /><polygon points="1511.9737929220375,359.93756154998755 1500,365 1511.9737929220375,370.06243845001245" fill="#4d6783" /><rect x="1804.0" y="327" width="242.0" height="40" fill="white" /><text text-anchor="middle" font-size="20" font-family="Microsoft YaHei,sans-serif" x="1925.0" y="351.0" fill="#213b58">受信调用身份及绑定系统</text><line stroke-width="2" x1="2350" y1="585" x2="1500" y2="585" stroke="#4d6783" /><polygon points="1511.9737929220375,579.9375615499875 1500,