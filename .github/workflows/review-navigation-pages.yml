name: Publish course review navigation

on:
  push:
    branches: [codex/review-navigation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-review-navigation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Package navigation and design atlas
        run: python3 review-navigation/build.py _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: publish
