version: "3.8"

# 数据库单独部署，应用更新时不重建数据库服务。
services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rbac1}
      MYSQL_USER: ${RBAC1_DB_USERNAME:?Set RBAC1_DB_USERNAME}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      TZ: Asia/Shanghai
    secrets:
      - source: db_password
        target: mysql_app_password
      - source: mysql_root_password
        target: mysql_root_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [rbac]
    # 仅容器网络访问 3306，不向公网发布数据库端口。
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$$(cat /run/secrets/mysql_root_password)" mysql --protocol=TCP --host=127.0.0.1 --user=root --execute="SELECT 1" --silent > /dev/null'
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 5
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
          - node.labels.rbac.role == database
      update_config:
        order: stop-first
        parallelism: 1
      rollback_config:
        order: stop-first
        parallelism: 1
      resources:
        limits:
          memory: ${MYSQL_MEMORY_LIMIT:-1024M}
        reservations:
          memory: ${MYSQL_MEMORY_RESERVATION:-512M}

volumes:
  mysql_data:
    driver: local

networks:
  rbac:
    external: true
    name: ${RBAC_NETWORK:-javaee-proxy}

secrets:
  db_password:
    external: true
    name: ${DB_PASSWORD_SECRET:-rbac_db_password_v1}
  mysql_root_password:
    external: true
    name: ${MYSQL_ROOT_PASSWORD_SECRET:-rbac_mysql_root_password_v1}
