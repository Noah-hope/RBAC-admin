# TLS certificate must cover the hostname used by the browser.
server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
}
server {
    listen 8081;
    server_name localhost;
    access_log off;
    location = /healthz { return 200 'ok'; }
    location / { return 404; }
}
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /run/secrets/tls-cert;
    ssl_certificate_key /run/secrets/tls-key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;
    access_log off;
    # Docker DNS; resolve dynamically so backend may be scaled to zero during migration.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;
    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location /actuator/ { return 404; }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
