version: "3.8"

# 在 Manager 直接部署：docker stack deploy --with-registry-auth -c deploy/stack.yml rbac
# 一个 Stack 管理 MySQL、结构化后端、DDD 后端和前端。
# 镜像推送、各节点挂载目录和 Secret 准备完成后才能部署。
# 当前通过前端节点公网入口 http://113.44.137.160:8088 访问。
x-backend-environment: &backend-environment
  SERVER_PORT: "8080"
  SERVER_SHUTDOWN: graceful
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 30s
  SPRING_CONFIG_IMPORT: configtree:/run/secrets/
  RBAC1_DB_URL: "jdbc:mysql://rbac_mysql:3306/rbac1?serverTimezone=Asia/Shanghai"
  RBAC1_DB_USERNAME: rbac1_app
  RBAC1_ADMIN_USERNAME: admin
  RBAC1_JWT_ISSUER: http://113.44.137.160:8088
  RBAC1_JWT_PRIVATE_KEY: file:/run/secrets/jwt_private.pem
  RBAC1_JWT_PUBLIC_KEY: file:/run/secrets/jwt_public.pem
  RBAC1_CORS_ALLOWED_ORIGINS: http://113.44.137.160:8088,http://120.46.76.13:8089
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"

x-backend-secrets: &backend-secrets
  - source: db_password
    target: RBAC1_DB_PASSWORD
    uid: "10001"
    gid: "10001"
    mode: 0400
  - source: admin_password
    target: RBAC1_ADMIN_PASSWORD
    uid: "10001"
    gid: "10001"
    mode: 0400
  - source: jwt_private
    target: jwt_private.pem
    uid: "10001"
    gid: "10001"
    mode: 0400
  - source: jwt_public
    target: jwt_public.pem
    uid: "10001"
    gid: "10001"
    mode: 0400

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-deploy: &backend-deploy
  replicas: 1
  update_config:
    order: stop-first
    parallelism: 1
    failure_action: rollback
  rollback_config:
    order: stop-first
    parallelism: 1
  resources:
    limits:
      memory: 1024M
    reservations:
      memory: 512M

services:
  mysql:
    image: swr.cn-north-4.myhuaweicloud.com/javaee-adgn/mysql:8.4.8
    environment:
      MYSQL_DATABASE: rbac1
      MYSQL_USER: rbac1_app
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      TZ: Asia/Shanghai
    secrets:
      - source: db_password
        target: mysql_app_password
      - source: mysql_root_password
        target: mysql_root_password
    volumes:
      - type: bind
        source: /root/rbac/mysql/data
        target: /var/lib/mysql
    networks: [rbac]
    # 不发布公网 3306 端口；临时初始化阶段不开 TCP，完成后此检查才能成功。
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$$(cat /run/secrets/mysql_root_password)" mysql --protocol=TCP --host=127.0.0.1 --user=root --execute="SELECT 1" --silent > /dev/null'
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 5
    stop_grace_period: 60s
    logging: *logging
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
          - node.labels.rbac.role == database
      # 数据目录同一时间只由一个 MySQL 容器使用。
      update_config:
        order: stop-first
        parallelism: 1
      rollback_config:
        order: stop-first
        parallelism: 1
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M

  structured:
    image: swr.cn-north-4.myhuaweicloud.com/javaee-adgn/rbac1-structured:1.0.0
    environment:
      <<: *backend-environment
      LOGGING_LEVEL_COM_RBAC_RBAC1_CONTROLLER: DEBUG
      LOGGING_LEVEL_COM_RBAC_RBAC1_SERVICE: DEBUG
      LOGGING_LEVEL_COM_RBAC_RBAC1_MAPPER: DEBUG
    secrets: *backend-secrets
    volumes:
      - type: bind
        source: /root/rbac/logs/structured
        target: /app/logs
    networks: [rbac]
    stop_grace_period: 40s
    logging: *logging
    deploy:
      <<: *backend-deploy
      # 首次可先设为 0，待 MySQL 初始化完成后再改为 1。
      replicas: 1
      placement:
        constraints:
          - node.role == worker
          - node.labels.rbac.role == structured

  ddd:
    image: swr.cn-north-4.myhuaweicloud.com/javaee-adgn/rbac1-ddd:1.0.0
    environment:
      <<: *backend-environment
      LOGGING_LEVEL_COM_RBAC_RBAC1DDD_INTERFACES: DEBUG
      LOGGING_LEVEL_COM_RBAC_RBAC1DDD_APPLICATION: DEBUG
      LOGGING_LEVEL_COM_RBAC_RBAC1DDD_INFRASTRUCTURE: DEBUG
    secrets: *backend-secrets
    volumes:
      - type: bind
        source: /root/rbac/logs/ddd
        target: /app/logs
    networks: [rbac]
    stop_grace_period: 40s
    logging: *logging
    deploy:
      <<: *backend-deploy
      # 与结构化后端同时常驻热备，通过 deploy/switch-backend.sh 切换前端网关上游。
      replicas: 1
      placement:
        constraints:
          - node.role == worker
          - node.labels.rbac.role == ddd

  frontend:
    image: swr.cn-north-4.myhuaweicloud.com/javaee-adgn/rbac-frontend:1.0.0
    environment:
      # 默认连接结构化后端；执行 ./deploy/switch-backend.sh ddd|structured 可秒级切换。
      RBAC_API_UPSTREAM: rbac_structured:8080
    ports:
      - target: 80
        published: 8088
        protocol: tcp
        mode: ingress
    networks: [rbac]
    logging: *logging
    deploy:
      # 首次可先设为 0，待结构化后端启动成功后再改为 1。
      replicas: 1
      placement:
        constraints:
          - node.role == worker
          - node.labels.rbac.role == frontend
      update_config:
        order: stop-first
        failure_action: rollback
      resources:
        limits:
          memory: 128M

networks:
  rbac:
    external: true
    name: rbac-net

secrets:
  db_password:
    external: true
    name: rbac_db_password_v1
  mysql_root_password:
    external: true
    name: rbac_mysql_root_password_v1
  admin_password:
    external: true
    name: rbac_admin_password_v1
  jwt_private:
    external: true
    name: rbac_jwt_private_v1
  jwt_public:
    external: true
    name: rbac_jwt_public_v1
